    <td class="r" style="white-space:nowrap">${editQ ? `<input class="pin r" data-edit="q" data-i="${i}" value="${l.q}" style="width:64px" aria-label="Item ${i+1} quantity">` : `<span class="num">${l.q}</span>`} <span class="muted" style="font-size:11.5px">${esc(l.u)}</span></td>
    <td style="min-width:150px">${editCost ? `<select class="pin" data-edit="v" data-i="${i}" aria-label="Item ${i+1} vendor">${VENDORS.map(v => `<option value="${v.id}" ${v.id === l.v ? 'selected' : ''}>${esc(v.name)}</option>`).join('')}</select>` : esc(vend(l.v).name)}</td>
    ${showCost ? `<td class="r">${editCost ? `<input class="pin r" data-edit="c" data-i="${i}" value="${l.c == null ? '' : l.c}" placeholder="pending" style="width:84px" aria-label="Item ${i+1} vendor cost">` : l.c == null ? '<span class="muted">pending</span>' : `<span class="num">${inrD(l.c)}</span>`}</td>` : ''}
    ${showMargin ? `<td class="r" style="white-space:nowrap">${editMargin ? `<input class="pin r" data-edit="m" data-i="${i}" value="${l.m}" style="width:56px" aria-label="Item ${i+1} margin"> <select class="pin" data-edit="t" data-i="${i}" style="width:58px;padding-right:26px;background-position:right 9px center" aria-label="Item ${i+1} margin type"><option value="pct" ${l.t === 'pct' ? 'selected' : ''}>%</option><option value="fix" ${l.t === 'fix' ? 'selected' : ''}>₹</option></select>` : `<span class="num">${l.t === 'pct' ? l.m + '%' : inr(l.m) + ' /unit'}</span>`}${low ? ' <span class="stamp red" style="font-size:10px;padding:3px 8px 3px 7px">Low</span>' : ''}</td>
    <td class="r num">${lc.ok ? pct(lc.gm) : '·'}</td>` : ''}
    <td class="r num">${lc.ok ? inrD(lc.unitSell) : '<span class="muted">·</span>'}</td>
    <td class="r num">${lc.ok ? inr(lc.sell) : '<span class="muted">·</span>'}</td>
    ${editQ ? `<td><button class="btn sm" data-act="delLine" data-i="${i}" title="Remove line" aria-label="Remove line ${i+1}" style="padding:6px 9px">✕</button></td>` : ''}
  </tr>`; }).join('');

  const totals = `<div class="totals">

    <div class="tot"><div class="lbl">GST ${S().gst}%</div><div class="val">${inr(c.gst)}</div></div>
    <div class="tot hi"><div class="lbl">Grand total</div><div class="val">${inr(c.grand)}</div></div>
  </div>`;

  const lines = `<div class="tablewrap"><table class="ledger lines"><thead><tr><th>#</th><th>Item</th><th class="r">Qty</th><th>Vendor</th>${showCost ? '<th class="r">Vendor cost /unit</th>' : ''}${showMargin ? `<th class="r">Margin (${S().basis === 'markup' ? 'markup on cost' : 'on sale'})</th><th class="r">Gross %</th>` : ''}<th class="r">Sell /unit</th><th class="r">Amount</th>${editQ ? '<th></th>' : ''}</tr></thead><tbody>${lineRows}</tbody></table></div>

    ${totals}
    ${showMargin && c.needsApproval ? `<div class="warn"><b>Margin approval needed.</b> ${c.below.map(x => `Line ${x.i+1} is at ${pct(x.c.gm)} gross`).join('; ')}, below the ${S().floor}% floor. ${can('approveMargin') ? `<button class="btn sm primary" data-act="approve">Approve this quotation's margins</button>` : 'Ask the Sales Manager or Owner to approve.'}</div>` : ''}
    ${showMargin && q.marginApproved ? `<div class="ok">Below-floor margin approved by <b>${esc(userName(q.marginApproved.by))}</b> on ${fmtDY(q.marginApproved.at)}. Any further margin change withdraws this approval automatically.</div>` : ''}
    ${showMargin && q.stage >= sentIdx && q.outcome === 'open' ? `<div class="note">This quotation has already gone to the customer. Changing any margin or price now creates <b>Revision ${q.revision + 1}</b> and is written to the audit trail.</div>` : ''}`;

  const activity = `<ul class="feed">${q.history.map(h => ({at:h.at, who:null, text:`Moved to <b>${esc(S().stages[h.stage].name)}</b>`})).concat(q.activity.map(a => ({at:a.at, who:a.who, text:esc(a.text)}))).sort((a,b) => a.at < b.at ? 1 : -1).map(a => `<li><span class="when">${fmtDY(a.at)}</span><span class="who">${a.who ? `<b>${esc(userName(a.who))}</b>: ` : ''}${a.text}</span></li>`).join('')}</ul>

  const audit = showMargin ? `<div class="b s5"><h3>Margin audit trail <span class="sub">cannot be edited</span></h3>${q.audit.length ? `<ul class="feed">${q.audit.slice().reverse().map(a => `<li><span class="when">${fmtDY(a.at)}</span><span class="who"><b>${esc(userName(a.who))}</b> changed line ${a.line + 1} ${esc(a.field)} from <span class="num">${esc(a.from)}</span> to <span class="num">${esc(a.to)}</span>${a.reason ? ` · <i>${esc(a.reason)}</i>` : ''}</span></li>`).join('')}</ul>` : '<div class="empty">No margin changes yet.</div>'}</div>` : '';

  /* Customer tile */
  const k = cu.contacts[0];
  const custTile = `<div class="b s4 t6 hero-card"><div class="eyebrow">Customer</div>
    <div class="hc-top"><div class="av lg" style="background:${cu.color}">${esc(initials(cu.name))}</div><div><div class="cust-n">${esc(cu.name)}</div><div class="meta">${esc(cu.site)} · ${esc(cu.industry)}</div></div></div>
    <dl class="kv"><dt>Contact</dt><dd>${esc(k.n)}, ${esc(k.r)}<br><span class="num">${esc(k.p)}</span></dd><dt>Terms</dt><dd>${esc(cu.terms)}</dd><dt>Owner</dt><dd>${esc(userName(q.owner))}</dd></dl></div>`;

  /* Status tile */
  const sc = stageColor(q.stage), esc2 = esc(state.roles[info.st.escalate].label);
  let prog;
  if (q.outcome === 'open' && info.st.target > 0) {
    const t = info.st.target, w = Math.max(4, Math.min(100, info.d / t * 100));
    prog = `<div class="dayp"><div class="dayp-l"><span>Day ${info.d} of ${t}</span><span class="${info.over > 0 ? 'over' : ''}">${info.over > 0 ? info.over + 'd over target' : (t - info.d) + 'd left'}</span></div><div class="dayp-t"><i style="width:${w}%;background:${info.over > 0 ? 'var(--red)' : sc}"></i></div><div class="dayp-f">${info.status === 'stuck' ? `Escalated to <b>${esc2}</b>` : `Follow up after ${info.st.followUp} day${info.st.followUp === 1 ? '' : 's'}, escalates to ${esc2}`}</div></div>`;
  } else if (q.outcome === 'open') prog = '<div class="dayp-f">No time target at this stage.</div>';
  else if (q.outcome === 'won') prog = `<div class="dayp-f">Won and closed on ${fmtDY(info.entered)}, ${days(q.history[0].at, info.entered)} days end to end.</div>`;
  else prog = `<div class="dayp-f">Lost on ${fmtDY(q.lostAt)}: ${esc(q.lostWhy)}</div>`;
  const actions = q.outcome === 'open' ? `${(next && can('advanceStage')) || (can('editQuote') && q.stage >= sentIdx) ? `<div class="btnrow">${next && can('advanceStage') ? `<button class="btn primary" data-act="advance" ${blockers.length ? 'disabled' : ''} title="${esc(blockers.join(' '))}">Move to ${esc(next.short)} ${ico('next')}</button>` : ''}${can('editQuote') && q.stage >= sentIdx ? '<button class="btn danger" data-act="lost">Mark lost</button>' : ''}</div>` : ''}${blockers.map(b => `<div class="warn" style="margin:0">${b}</div>`).join('')}` : '';
  const statusTile = `<div class="b s4 t6 statusb"><div class="eyebrow">Where it stands</div>${statusStamp(info.status).replace('class="stamp', 'class="stamp big')}<div class="stagename">${sdot(q.stage, 'width:10px;height:10px')}${esc(info.st.name)}</div>${subStatus(q) ? `<div class="substate">${esc(subStatus(q))}</div>` : ''}${prog}${actions}</div>`;

  /* Value and margin tile */
  const floor = S().floor, mmax = Math.max(30, Math.ceil((c.gm + 5) / 5) * 5);
  const meter = c.incomplete === q.lines.length ? '<div class="empty" style="margin-top:10px">No vendor cost entered.</div>'
    : `<div class="mm" role="img" aria-label="Gross margin ${pct(c.gm)}, floor ${floor}%"><div class="mm-t"><i class="${c.needsApproval ? 'low' : ''}" style="width:${Math.min(100, Math.max(2, c.gm / mmax * 100)).toFixed(1)}%"></i><b style="left:${(floor / mmax * 100).toFixed(1)}%"></b></div><div class="mm-l"><span style="left:${Math.max(9, Math.min(91, floor / mmax * 100)).toFixed(1)}%">floor ${floor}%</span></div></div>
      <div class="hc-big">${inr(c.margin)} margin</div><div class="meta">gross ${pct(c.gm)} on sale · markup ${pct(c.markup)} on cost</div>
      ${c.needsApproval ? '<span class="stamp amber">Needs approval</span>' : q.marginApproved ? '<span class="stamp green">Approved below floor</span>' : ''}`;
  const valueTile = `<div class="b s4 t12 valb"><div class="eyebrow">${showMargin ? 'Value and margin' : 'Value'}</div>
    <div class="hc-val"><span class="val">${c.sell ? lakh(c.sell) : '·'}</span><span class="hc-sub">ex GST</span></div>
    <div class="hc-sub">${inr(c.grand)} with GST ${S().gst}%${c.incomplete ? ` · <em>${c.incomplete} line${c.incomplete > 1 ? 's' : ''} awaiting cost</em>` : ''}</div>
    ${showMargin ? meter : '<p class="locked" style="margin-top:auto">Vendor cost and margin are hidden for your role.</p>'}</div>`;

  const head = pageHead({left:`<button class="btn iconbtn" data-act="backToList" title="Back to all quotations" aria-label="Back to all quotations">${ico('arrow')}</button>`, eyebrow:`Quotation ${q.id} · Rev ${q.revision}`, title:esc(q.title), lead:`${esc(cu.name)} · received ${fmtDY(q.history[0].at)} · owner ${esc(userName(q.owner))}`, right:`<button class="btn" data-act="preview">${ico('file')} Customer copy</button>`});
  return head + `<div class="bento">
    ${custTile}${statusTile}${valueTile}
    <div class="b s12"><h3>Journey <span class="sub">intake to delivery, with the days spent at each stage against its target</span></h3>${(h => { state.jAnimDone = true; return h; })(journeyRec(q))}</div>
    <div class="b s12"><h3>Line items and margin <span class="sub">${showMargin ? 'vendor cost, margin and sell price per line' : 'sell prices only for your role'}</span></h3>${lines}</div>
    <div class="b ${showMargin ? 's7' : 's12'}"><h3>Activity</h3>${activity}</div>
    ${audit}
  </div>`;
}

/* ---------- Customers ---------- */
function viewCustomers(){

  const tot = rows.reduce((a,x) => a + x.val, 0), maxV = Math.max(1, ...rows.map(x => x.val)), nOpen = rows.reduce((a,x) => a + x.co.length, 0);

  const won12 = CUST_STATS.reduce((a,s) => a + s.won, 0);
  const hero = `<div class="b s6 hero-card"><div class="eyebrow">In play across customers</div>
    <div class="hc-val"><span class="val">${lakh(tot)}</span><span class="hc-sub">open quotation value, by customer</span></div>

  const attTile = `<div class="b s6"><h3>Needs a call <span class="sub">Stuck or due</span></h3>${att.length ? `<div class="plist">${att.map(x => { const k = x.c.contacts[0]; const w = x.co.map(q => ({q, i:stageInfo(q)})).filter(y => y.i.status === 'stuck' || y.i.status === 'followup').sort((a,b) => b.i.over - a.i.over)[0]; return `<div class="prow click" data-act="openQuote" data-id="${w.q.id}"><div class="av sm" style="background:${x.c.color}">${esc(initials(x.c.name))}</div><div class="p-n"><b>${esc(x.c.name)}, ${esc(k.n)}</b><span><span class="num">${esc(k.p)}</span> · ${w.q.id.slice(-4)} at ${esc(w.i.st.short)}, day ${w.i.d}</span></div><div>${statusStamp(w.i.status)}</div></div>`; }).join('')}</div>` : '<div class="ok">No stuck or due quotations.</div>'}</div>`;

  let rec = '';
  const c = CUSTOMERS.find(x => x.id === state.openCust);
  if (c) {
    const x = rows.find(r => r.c.id === c.id), stat = CUST_STATS.find(s => s.c === c.id), wr = Math.round(stat.nW / stat.nQ * 100);
    const perStage = S().stages.map((s, i) => x.co.filter(q => q.stage === i));
    rec = `<div class="seclabel" id="recLabel"><b>${esc(c.name)}</b><span class="sub">customer record</span><span class="spacer"></span><button class="btn sm" data-act="openCust" data-id="${c.id}">Close record</button></div>
    <div class="bento">
      <div class="b s5 hero-card"><div class="hc-top"><div class="av lg" style="background:${c.color}">${esc(initials(c.name))}</div><div><div class="cust-n">${esc(c.name)}</div><div class="meta">${esc(c.site)} · ${esc(c.industry)} · since ${c.since}</div></div></div>
        <div class="hc-val"><span class="val">${lakh(x.val)}</span><span class="hc-sub">${x.co.length} open · payment terms ${esc(c.terms)}</span></div>
        ${x.co.length ? `<div class="mixbar">${perStage.map((list, i) => list.length ? `<i style="flex:${list.length};background:${stageColor(i)}" data-tip="${esc(S().stages[i].name)}: ${list.length}"></i>` : '').join('')}</div><div class="hc-legend">${perStage.map((list, i) => list.length ? `<span>${sdot(i)}${esc(S().stages[i].short)} ${list.length}</span>` : '').join('')}</div>` : '<div class="empty">No open quotations.</div>'}

      <div class="b s4 t6"><div class="eyebrow">Relationship, 12 months</div><div class="hc-row">${gaugeSVG(wr, 100, 'Win rate %', '#178f64')}<div><div class="hc-big">${lakh(stat.won)} won</div><div class="meta">of ${lakh(stat.quoted)} quoted · win rate ${wr}%</div></div></div>
        <div class="hc-stats"><div><span>Quotes</span><b>${stat.nQ}</b></div><div><span>Orders</span><b>${stat.nW}</b></div><div><span>Cycle</span><b>${stat.avgDays}d</b></div><div><span>Margin</span><b>${can('viewMargin') ? pct(stat.gm) : '<span class="locked">hidden</span>'}</b></div></div></div>
      <div class="b s3 t6"><div class="eyebrow">Contacts</div><div class="plist">${c.contacts.map(kk => `<div class="prow"><div class="avatar sm">${esc(initials(stripHon(kk.n)))}</div><div class="p-n"><b>${esc(kk.n)}</b><span>${esc(kk.r)}</span><span class="num">${esc(kk.p)}</span></div></div>`).join('')}</div>${can('manageCustomers') ? `<div class="btnrow" style="margin:auto 0 0;padding-top:12px"><button class="btn sm" data-act="soon">${ico('plus')} Add contact</button></div>` : ''}</div>
      <div class="b s12"><h3>Quotations <span class="sub">${x.cq.length} visible to you</span></h3>${qList(x.cq, {mainLabel:'Subject', main:q => [esc(q.title), `${q.lines.length} line${q.lines.length === 1 ? '' : 's'}`], empty:'No quotations visible to you.'})}</div>
    </div>`;
  }
  return pageHead({title:'Customers', right: can('manageCustomers') ? `<button class="btn primary" data-act="soon">${ico('plus')} New customer</button>` : ''})
    + `<div class="bento">${hero}${attTile}${cards}</div>${rec}`;
}

/* ---------- Reports (charts) ---------- */
function barChart(opts){
  const {id, cats, series, colors, fmt, title, cap, target} = opts;
  const W = 640, H = 240, padL = 56, padR = 12, padT = 14, padB = 34;
  const maxV = Math.max(...series.flatMap(s => s.v), ...(target || [0])) * 1.12 || 1;
  const y = v => padT + (H - padT - padB) * (1 - v / maxV);
  const gw = (W - padL - padR) / cats.length, bw = Math.min(28, (gw - 10) / series.length - 2);
  const ticks = 4;
  let g = '';
  for (let i = 0; i <= ticks; i++) { const v = maxV / ticks * i; g += `<line x1="${padL}" x2="${W - padR}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="rgba(40,33,26,.09)" stroke-width="1"/><text x="${padL - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end" font-size="10" fill="#95908a">${fmt(v, true)}</text>`; }
  let bars = '';
  cats.forEach((c, ci) => {
    const x0 = padL + gw * ci + (gw - (bw + 2) * series.length) / 2;
    series.forEach((s, si) => { const v = s.v[ci], x = x0 + si * (bw + 2), yy = y(v), h = H - padB - yy; bars += `<rect class="bar" x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${bw}" height="${Math.max(0, h).toFixed(1)}" rx="3" fill="${opts.catColors ? opts.catColors[ci] : colors[si]}" data-tip="${esc(c)}\n${esc(s.n)}: ${fmt(v)}"/>`; });
    if (target) { const tx = x0 - 3, ty = y(target[ci]); bars += `<line x1="${tx}" x2="${(x0 + (bw + 2) * series.length + 1).toFixed(1)}" y1="${ty.toFixed(1)}" y2="${ty.toFixed(1)}" stroke="#151515" stroke-width="2" stroke-dasharray="4 2" data-tip="${esc(c)} target: ${fmt(target[ci])}"/>`; }
    bars += `<text x="${(padL + gw * ci + gw / 2).toFixed(1)}" y="${H - padB + 14}" text-anchor="middle" font-size="10" fill="#635e57">${esc(c)}</text>`;
  });
  const legend = series.length > 1 || target ? `<div class="legend">${series.map((s, i) => `<span><i style="background:${colors[i]}"></i>${esc(s.n)}</span>`).join('')}${target ? '<span><i style="background:transparent;border-top:2px dashed #151515;height:0;vertical-align:3px"></i>Target</span>' : ''}</div>` : '';
  const table = `<div class="charttbl" id="tbl-${id}"><table class="ledger"><thead><tr><th></th>${series.map(s => `<th class="r">${esc(s.n)}</th>`).join('')}${target ? '<th class="r">Target</th>' : ''}</tr></thead><tbody>${cats.map((c, i) => `<tr><td>${esc(c)}</td>${series.map(s => `<td class="r num">${fmt(s.v[i])}</td>`).join('')}${target ? `<td class="r num">${fmt(target[i])}</td>` : ''}</tr>`).join('')}</tbody></table></div>`;
  return `<div class="chart b ${opts.span || 's6'}"><h4>${esc(title)}<span class="tbl-toggle" data-act="tbl" data-id="${id}">table</span></h4><div class="cap">${esc(cap)}</div>${legend}<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${g}<line x1="${padL}" x2="${W - padR}" y1="${H - padB}" y2="${H - padB}" stroke="#dbd6cf"/>${bars}</svg>${table}</div>`;
}
function hbarChart(opts){
  const {id, cats, vals, color, fmt, title, cap} = opts;
  const W = 640, rowH = 26, padL = 150, padR = 60, H = rowH * cats.length + 16;
  const maxV = Math.max(...vals) * 1.05 || 1;
  const bars = cats.map((c, i) => { const w = (W - padL - padR) * vals[i] / maxV, yy = 8 + i * rowH; return `<text x="${padL - 8}" y="${yy + 15}" text-anchor="end" font-size="11" fill="#1c1a17">${esc(c)}</text><rect class="bar" x="${padL}" y="${yy + 4}" width="${w.toFixed(1)}" height="${rowH - 10}" rx="3" fill="${color}" data-tip="${esc(c)}: ${fmt(vals[i])}"/><text x="${(padL + w + 6).toFixed(1)}" y="${yy + 15}" font-size="11" fill="#1c1a17">${fmt(vals[i])}</text>`; }).join('');
  const table = `<div class="charttbl" id="tbl-${id}"><table class="ledger"><tbody>${cats.map((c, i) => `<tr><td>${esc(c)}</td><td class="r num">${fmt(vals[i])}</td></tr>`).join('')}</tbody></table></div>`;
  return `<div class="chart b ${opts.span || 's6'}"><h4>${esc(title)}<span class="tbl-toggle" data-act="tbl" data-id="${id}">table</span></h4><div class="cap">${esc(cap)}</div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${bars}</svg>${table}</div>`;
}

    ${barChart({id:'st', cats:stageNames, series:[{n:'Actual avg days', v:STAGE_AVG}], colors:['#b86a10'], catColors:S().stages.slice(0, -1).map(s => s.color), target:S().stages.slice(0, -1).map(s => s.target), fmt:v => (Math.round(v * 10) / 10) + 'd', title:'Days spent in each stage vs target', cap:'Actual days against the targets in Settings.'})}

    <div class="hint">Both numbers print on every quotation.</div></div>`;

  const roundTile = `<div class="b s4 t6"><div class="eyebrow">Rounding and tax</div><div class="twof">

  return pageHead({title:'Settings', lead:'Timelines, margin policy, roles and integrations.'})
    + `<div class="bento">${timeline}${floorTile}${basisTile}${infoTile}${roundTile}${integrationTiles()}${matrix}${people}</div>`;

/* ===================== ACTIONS ===================== */
function showRecord(){ const r = document.getElementById('recLabel'); if (r && r.scrollIntoView) r.scrollIntoView({behavior:'smooth', block:'start'}); }
function go(tab){ state.tab = tab; state.quoteId = null; state.jAnimDone = false; render(); window.scrollTo({top:0}); }
function openQuote(id){ state.tab = 'quotations'; state.quoteId = id; state.doorTab = 'overview'; state.jAnimDone = false; render(); window.scrollTo({top:0}); }
function setEdit(q, i, field, raw){
  const l = q.lines[i]; const sentIdx = stageIdx('sent');
  if (q.remoteEdit) { fail('This quotation changed while you had it open', `${userName(q.remoteEdit.who)} edited it. Reload before you change anything.`); render(); return; }
  if (q.outcome !== 'open') { fail('This quotation is closed', 'Reopen it or raise a revision to make changes.'); render(); return; }
  const before = {c:l.c, m:l.m, t:l.t};
  if (field === 'd') { l.d = raw; return; }
  if (field === 'v') { l.v = raw; log(q, `Vendor for line ${i+1} set to ${vend(raw).name}`); return; }
  if (field === 'q') { const n = Number(raw); if (!(n > 0)) { toast('Quantity must be a positive number.', 'red'); render(); return; } l.q = n; return; }
  if (field === 'c') { if (raw === '') { l.c = null; } else { const n = Number(raw); if (!(n >= 0)) { toast('Vendor cost must be a number.', 'red'); render(); return; } l.c = n; } q.audit.push({at:iso(TODAY), who:state.userId, line:i, field:'vendor cost', from: before.c == null ? 'pending' : inrD(before.c), to: l.c == null ? 'pending' : inrD(l.c)}); }
  if (field === 'm') { const n = Number(raw); if (!(n >= 0)) { toast('Margin must be zero or more.', 'red'); render(); return; } if (l.t === 'pct' && S().basis === 'margin' && n >= 100) { toast('Margin on sale must be below 100%.', 'red'); render(); return; } l.m = n; }
  if (field === 't') { l.t = raw; }
  if (field === 'm' || field === 't') {
    const show = x => x.t === 'pct' ? x.m + '%' : inr(x.m) + '/unit';
    q.audit.push({at:iso(TODAY), who:state.userId, line:i, field:'margin', from:show(before), to:show(l)});
    if (q.marginApproved) { q.marginApproved = null; log(q, 'Margin changed after approval; approval withdrawn'); toast('Margin changed, previous approval withdrawn.', 'red'); }
  }
  if ((field === 'm' || field === 't' || field === 'c') && q.stage >= sentIdx && q.outcome === 'open') { q.revision++; log(q, `Price changed after sending; now Revision ${q.revision}`); toast(`Quotation is now Revision ${q.revision}.`); }
  render();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  const q = state.quoteId ? QUOTES.find(x => x.id === state.quoteId) : null;
  switch (act) {
    case 'tab': go(el.dataset.tab); break;
    case 'offline': state.offline = !state.offline; renderUsers(); toast(state.offline ? 'Connection lost. Working offline; edits are kept on this device.' : 'Back online. Pending changes synced.', state.offline ? 'red' : 'green'); break;
    case 'signout': state.auth.signedIn = false; state.auth.error = null; state.quoteId = null; render(); break;
    case 'openQuote': openQuote(id); break;
    case 'backToList': state.quoteId = null; state.jAnimDone = false; render(); break;
    case 'shelf': state.filters = {stage:el.dataset.stage, cust:'all', owner:'all', status:'all'}; state.quoteId = null; go('quotations'); break;
    case 'jsel': { state.jsel = Number(el.dataset.stage); const t = document.getElementById('journeyTile'); if (t) t.innerHTML = journeyTileInner(openQuotes()); else render(); break; }
    case 'openCust': state.openCust = state.openCust === id ? null : id; render(); if (state.openCust) showRecord(); break;
    case 'openVendor': state.openVendor = state.openVendor === id ? null : id; render(); if (state.openVendor) showRecord(); break;
    case 'stagefilter': state.filters.stage = el.dataset.stage === 'all' || state.filters.stage === el.dataset.stage ? 'all' : el.dataset.stage; render(); break;
    case 'statusfilter': state.filters.status = state.filters.status === el.dataset.status ? 'all' : el.dataset.status; render(); break;
    case 'clearFiltersOld': break;
    case 'tbl': document.getElementById('tbl-' + id).classList.toggle('show'); break;
    case 'nudge': { const t = QUOTES.find(x => x.id === id); const i = stageInfo(t); log(t, `Nudge sent to ${userName(t.owner)} and ${state.roles[i.st.escalate].label} (email + WhatsApp)`); toast(`Nudge sent for ${t.id} to ${userName(t.owner).split(' ')[0]}.`, 'green'); break; }
    case 'advance': { if (!q) break; const next = q.stage + 1; q.history.push({stage:next, at:iso(TODAY)}); q.stage = next; if (next === S().stages.length - 1) q.outcome = 'won'; log(q, `Moved to ${S().stages[next].name}`); toast(`${q.id} moved to ${S().stages[next].name}.`, 'green'); state.folderTab = 'journey'; render(); break; }
    case 'approve': { if (!q || !can('approveMargin')) break; q.marginApproved = {by:state.userId, at:iso(TODAY)}; log(q, 'Below-floor margin approved'); q.audit.push({at:iso(TODAY), who:state.userId, line:0, field:'approval', from:'pending', to:'approved', reason:'below-floor margin accepted'}); toast('Margins approved. The quote can now be sent.', 'green'); render(); break; }
    case 'lost': { if (!q || !needPerm('editQuote', 'close a quotation')) break; openModal(`<h3>Mark ${q.id} as lost</h3><div class="field"><label>Reason</label><textarea class="pin" id="lostWhy" placeholder="Lost on price, customer deferred, competitor…"></textarea></div><div class="btnrow"><button class="btn danger" data-act="lostConfirm">Mark lost</button><button class="btn" data-act="closeModal">Cancel</button></div>`); break; }
    case 'lostConfirm': { if (!q) break; q.outcome = 'lost'; q.lostAt = iso(TODAY); q.lostWhy = document.getElementById('lostWhy').value || 'No reason given'; log(q, 'Marked lost: ' + q.lostWhy); closeModal(); toast(`${q.id} marked lost.`, 'red'); render(); break; }
    case 'addNote': openModal(`<h3>Add a note to ${q.id}</h3><div class="field"><label>Note</label><textarea class="pin" id="noteText" placeholder="Spoke to…"></textarea></div><div class="btnrow"><button class="btn primary" data-act="noteConfirm">Save note</button><button class="btn" data-act="closeModal">Cancel</button></div>`); break;
    case 'noteConfirm': { const t = document.getElementById('noteText').value.trim(); if (t) { log(q, t); toast('Note added.', 'green'); } closeModal(); render(); break; }
    case 'addLine': q.lines.push({d:'New item', q:1, u:'nos', v:'v1', c:null, t:'pct', m:S().floor + 4}); log(q, 'Line added'); render(); break;
    case 'delLine': { if (q.lines.length < 2) { fail('A quotation needs at least one line', 'Edit this line instead of removing it.'); break; }
      q.lines.splice(Number(el.dataset.i), 1); log(q, 'Line removed'); render(); break; }

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'userSel') { state.userId = t.value; state.quoteId = null; if (state.tab === 'reports' && !can('viewReports')) state.tab = 'dashboard'; render(); toast(`Prototype: now viewing as ${me().name} (${roleOf(me()).label}).`); return; }
  if (t.dataset.filter) { state.filters[t.dataset.filter] = t.value; render(); return; }
  if (t.id === 'periodSel') { state.period = Number(t.value); render(); return; }
  if (t.dataset.edit) { const q = QUOTES.find(x => x.id === state.quoteId); setEdit(q, Number(t.dataset.i), t.dataset.edit, t.value); return; }
  if (t.dataset.stage) { const s = S().stages[Number(t.dataset.stage)], k = t.dataset.k; s[k] = (k === 'target' || k === 'followUp') ? Math.max(0, Number(t.value) || 0) : t.value; toast(`${s.name}: ${k === 'target' ? 'target' : k === 'followUp' ? 'follow-up' : k} updated. Dashboard recalculated.`); render(); return; }
  if (t.dataset.policy) { const k = t.dataset.policy; S()[k] = k === 'basis' ? t.value : Number(t.value); toast('Margin policy updated; every quotation recalculated.'); render(); return; }
  if (t.dataset.user) { state.users.find(u => u.id === t.dataset.user).role = t.value; toast('Role changed.'); render(); return; }
});
document.addEventListener('input', e => {
  if (e.target.id === 'custSearch') { state.custSearch = e.target.value; const pos = e.target.selectionStart; render(); const el = document.getElementById('custSearch'); el.focus(); el.setSelectionRange(pos, pos); }
  if (e.target.id === 'globalSearch') { /* handled on Enter */ }
});
document.addEventListener('keydown', e => {
  if (e.target.id !== 'globalSearch' || e.key !== 'Enter') return;
  const v = e.target.value.trim(); if (!v) return;
  const lv = v.toLowerCase();
  const byId = QUOTES.find(q => q.id.toLowerCase().includes(lv) || q.title.toLowerCase().includes(lv) || q.lines.some(l => l.d.toLowerCase().includes(lv)));
  const c = CUSTOMERS.find(x => x.name.toLowerCase().includes(lv));
  if (c) { state.custSearch = c.name; go('dashboard'); }
  else if (byId) openQuote(byId.id);
  else toast(`Nothing found for "${esc(v)}".`, 'red');
  e.target.value = '';
});
document.addEventListener('mouseover', e => { const t = e.target.closest('[data-tip]'); const tip = document.getElementById('tip'); if (!t) { tip.style.display = 'none'; return; } tip.textContent = t.dataset.tip; tip.style.display = 'block'; });
document.addEventListener('mousemove', e => { const tip = document.getElementById('tip'); if (tip.style.display !== 'block') return; tip.style.left = Math.min(window.innerWidth - 270, e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 14) + 'px'; });
document.getElementById('modalwrap').addEventListener('click', e => { if (e.target.id !== 'modalwrap') return; if (state.wiz && state.wiz.open) return; closeModal(); });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (TABS.some(t => t[0] === h) && h !== state.tab) go(h); });

/* ===================== ERRORS, GUARDS, VALIDATION ===================== */
function fail(msg, sub){ toast(`<b>${esc(msg)}</b>${sub ? `<br><span style="font-weight:500;color:var(--text-2)">${esc(sub)}</span>` : ''}`, 'red'); }
function okT(msg, sub){ toast(`<b>${esc(msg)}</b>${sub ? `<br><span style="font-weight:500;color:var(--text-2)">${esc(sub)}</span>` : ''}`, 'green'); }
function needPerm(p, what){
  if (can(p)) return true;
  fail('Not allowed for your role', `${roleOf(me()).label} cannot ${what}. Ask the Owner or the Sales Manager.`);
  return false;
}
function errBox(title, body, actions){
  return `<div class="errbox">${ico('alert')}<div><b>${esc(title)}</b>${body ? esc(body) : ''}${actions || ''}</div></div>`;
}
let _confirmFn = null;
function confirmDo(o){
  _confirmFn = o.fn;
  openModal(`<h3>${esc(o.title)}</h3><p class="lead" style="margin:0 0 4px">${esc(o.body)}</p>
    ${o.warn ? `<div class="warn">${esc(o.warn)}</div>` : ''}
    <div class="btnrow" style="margin-bottom:0"><button class="btn ${o.danger ? 'danger' : 'primary'}" data-act="confirmYes">${esc(o.label)}</button><button class="btn" data-act="closeModal">Cancel</button></div>`);
}
const V = {
  req:(v, l) => !String(v == null ? '' : v).trim() ? l + ' is required' : '',
  email:v => !/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(String(v || '').trim()) ? 'Enter a valid email address' : '',
  phone:v => String(v || '').replace(/\D/g, '').length < 8 ? 'Enter a valid phone number' : '',
  num:(v, l, min, max) => { const n = Number(v);
    if (String(v).trim() === '' || isNaN(n)) return l + ' must be a number';
    if (min != null && n < min) return `${l} cannot be below ${min}`;
    if (max != null && n > max) return `${l} cannot be above ${max}`;

/* anything that leaves the building is queued when there is no connection */

function pageHead(o){

function matchQ(q, term){
  if (!term) return true;
  const t = term.toLowerCase();
  return [qref(q), q.title, q.subject, cust(q.cust).name, userName(q.owner), PTYPE(q.ptype).name]
    .some(s => String(s).toLowerCase().includes(t)) || q.lines.some(l => l.d.toLowerCase().includes(t));
}
function filteredQuotes(){
  const f = state.filters;
  let qs = visibleQuotes().filter(q => matchQ(q, f.q));
  if (f.ptype !== 'all') qs = qs.filter(q => q.ptype === f.ptype);
  if (f.stage !== 'all') qs = qs.filter(q => String(q.stage) === f.stage && q.outcome === 'open');
  if (f.cust !== 'all') qs = qs.filter(q => q.cust === f.cust);

  if (f.status !== 'all') qs = qs.filter(q => stageInfo(q).status === f.status);

function mailBody(q){

    + `Delivery: ${q.terms.delivery}\n\nWe look forward to your valuable purchase order.\n\n`
    + `Thanking you,\nFor ${CO.name}\n${CO.email}`;
}
function mailOpen(){
  const q = QUOTES.find(x => x.id === state.quoteId);
  if (!q) return fail('Open a quotation first');
  if (!state.mail.connected) {
    return openModal(`<h3>Outlook is not connected</h3>${errBox('No mailbox is linked', 'Reconnect the Outlook account before sending anything from the CRM.')}
      <div class="btnrow" style="margin-bottom:0"><button class="btn primary" data-act="mailReconnect">Reconnect Outlook</button><button class="btn" data-act="closeModal">Cancel</button></div>`);
  }
  const c = quoteCalc(q);
  const warn = c.incomplete ? errBox('This quotation is not priced yet', `${c.incomplete} line(s) have no vendor cost, so the document shows "to be confirmed".`)
    : c.needsApproval ? errBox('Margin approval is still pending', `A line is below the ${S().floor}% floor. Sending now goes against policy.`) : '';
  openModal(`<h3>Email quotation ${esc(qref(q))}</h3>
    <div class="mailbar"><span class="dot"></span>From <b>&nbsp;${esc(state.mail.account)}</b><span class="spacer"></span><span class="chip">Outlook</span></div>
    ${warn}
    <div class="mrow"><span class="k">To</span><input class="pin" id="mTo" value="${esc(q.attn.e)}"></div>
    <div class="mrow"><span class="k">Cc</span><input class="pin" id="mCc" value="${esc(CO.email)}"></div>
    <div class="mrow"><span class="k">Subject</span><input class="pin" id="mSub" value="${esc(PTYPE(q.ptype).name)} Proposal ${esc(qref(q))} – ${esc(q.subject)}"></div>
    <textarea class="pin mbody" id="mBody">${esc(mailBody(q))}</textarea>
    <div class="attach">${ico('file')} ${esc(qref(q))}.pdf <span class="muted">· ${(18 + q.lines.length * 2)} KB</span></div>
    <div id="mErr"></div>
    <div class="btnrow" style="margin-bottom:0"><button class="btn primary" data-act="mailSend">${ico('mail')} Send</button>
      <button class="btn" data-act="closeModal">Cancel</button>
      <span class="hint">${state.offline ? 'Offline. This will be queued.' : 'Logged against the quotation.'}</span></div>`);
}
function mailSend(){
  const q = QUOTES.find(x => x.id === state.quoteId); if (!q) return;
  const to = (document.getElementById('mTo') || {}).value || '', sub = (document.getElementById('mSub') || {}).value || '';
  const box = document.getElementById('mErr');
  const e1 = V.req(to, 'A recipient') || V.email(to), e2 = V.req(sub, 'A subject');
  if (e1 || e2) { if (box) box.innerHTML = errBox('That email cannot go out yet', e1 || e2); return; }
  const doSend = () => {
    if (state.mail.failNext) {
      if (box) box.innerHTML = errBox('Outlook rejected the message', 'The mailbox refused the request (550 relay denied). Nothing was sent.',
        '<div class="btnrow" style="margin:8px 0 0"><button class="btn sm primary" data-act="mailSend">Try again</button><button class="btn sm" data-act="mailFailOff">Clear the simulated failure</button></div>');
      return false;
    }
    q.sent = {at:iso(TODAY), to};
    state.mail.outbox.push({at:iso(TODAY), to, sub, q:q.id});
    log(q, `Quotation ${qref(q)} emailed to ${to} from Outlook`);
    if (q.stage < stageIdx('sent') && can('advanceStage')) {
      while (q.stage < stageIdx('sent')) { q.stage++; q.history.push({stage:q.stage, at:iso(TODAY)}); }
      log(q, 'Moved to Quoted to customer when the offer was emailed');
    }
    closeModal(); render();
    okT('Sent from Outlook', `${qref(q)} went to ${to}.`);
    return true;
  };
  whenOnline(`Email ${qref(q)} to ${to}`, doSend);
}

/* ===================== QUOTATION WIZARD ===================== */
const WSTEPS = ['Type', 'Customer', 'Subject', 'Items', 'Terms', 'Review'];
function nextRef(){
  const n = Math.max(...QUOTES.map(q => parseInt(String(q.refBase).replace(/\D/g, '').slice(-2)) || 0), 52) + 1;
  return 'VJ-K2612' + String(n).padStart(2, '0');
}
function wizOpen(pre){
  if (!needPerm('editQuote', 'create quotations')) return;
  const c = CUSTOMERS[0];
  state.wiz = {open:true, step:0, err:{}, d:{
    ptype:'', cust:c.id, attn:{n:c.contacts[0].n, r:c.contacts[0].r, e:c.contacts[0].e, p:c.contacts[0].p},
    toAddr:c.addr, subject:'', intro:DEFAULT_INTRO, owner:state.userId,
    lines:[{d:'', q:1, u:'nos', v:'v1', c:null, t:'pct', m:S().floor + 4}],
    terms:Object.assign({}, DEFAULT_TERMS), refBase:nextRef()}};
  if (pre) Object.assign(state.wiz.d, pre);
  wizRender();
}
const DEFAULT_INTRO = 'This is with reference to your enquiry regarding the requirement above. We are pleased to submit our offer for your kind consideration.';
function wizQuote(){
  const d = state.wiz.d;
  return {id:'draft', cust:d.cust, title:d.subject || 'Untitled', owner:d.owner, stage:0, history:[{stage:0, at:iso(TODAY)}],
    lines:d.lines, outcome:'open', revision:1, marginApproved:null, activity:[], audit:[],
    ptype:d.ptype || 'product', subject:d.subject || 'Subject to be confirmed', refBase:d.refBase,
    attn:d.attn, toAddr:d.toAddr, terms:d.terms, intro:d.intro, sent:null};
}
function wizCollect(){
  const d = state.wiz.d;
  document.querySelectorAll('[data-wiz]').forEach(el => {
    const k = el.dataset.wiz;
    if (k.startsWith('line.')) { const [, i, f] = k.split('.'); const L = d.lines[Number(i)]; if (!L) return;
      L[f] = (f === 'c') ? (el.value.trim() === '' ? null : Number(el.value)) : (f === 'q' || f === 'm') ? Number(el.value) : el.value; }
    else if (k.startsWith('attn.')) d.attn[k.slice(5)] = el.value;
    else if (k.startsWith('terms.')) d.terms[k.slice(6)] = el.value;
    else d[k] = el.value;
  });
}
function wizValidate(step){
  const d = state.wiz.d, e = {};
  if (step === 0 && !d.ptype) e.ptype = 'Pick the kind of proposal this is';
  if (step === 1) {
    e['attn.n'] = V.req(d.attn.n, 'The name of the person who asked');
    e['attn.r'] = V.req(d.attn.r, 'Their designation');
    e['attn.e'] = V.req(d.attn.e, 'Their email') || V.email(d.attn.e);
    e['attn.p'] = V.req(d.attn.p, 'Their mobile') || V.phone(d.attn.p);
    e.toAddr = V.req(d.toAddr, 'The address the offer is addressed to');
  }
  if (step === 2) {
    e.subject = V.req(d.subject, 'A subject') || (d.subject.trim().length < 8 ? 'Give the subject a few more words, it prints as the title' : '');
    e.intro = V.req(d.intro, 'The opening paragraph');
  }
  if (step === 3) {
    if (!d.lines.length) e.lines = 'Add at least one item';
    d.lines.forEach((l, i) => {
      const er = V.req(l.d, 'A description') || V.num(l.q, 'Quantity', 0.001) || V.req(l.u, 'A unit')
        || (l.c != null && String(l.c) !== '' ? V.num(l.c, 'Cost', 0) : '')
        || V.num(l.m, 'Margin', 0, l.t === 'pct' && S().basis === 'margin' ? 99 : 100000);
      if (er) e['line.' + i] = `Line ${i + 1}: ${er}`;
    });
  }
  if (step === 4) { e['terms.validity'] = V.req(d.terms.validity, 'Offer validity'); e['terms.payment'] = V.req(d.terms.payment, 'Payment terms'); }
  state.wiz.err = Object.fromEntries(Object.entries(e).filter(([, v]) => v));
  return !Object.keys(state.wiz.err).length;
}
function wizRender(){
  const w = state.wiz, d = w.d, er = w.err;
  const E = k => er[k] ? `<span class="err">${esc(er[k])}</span>` : '';
  const bad = k => er[k] ? 'bad' : '';
  const F = (k, label, val, attrs) => `<div class="field ${bad(k)}"><label>${label}</label><input class="pin" data-wiz="${k}" value="${esc(val == null ? '' : val)}" ${attrs || ''}>${E(k)}</div>`;
  let body = '';
  if (w.step === 0) body = `<p class="lead">Sets the title on the document and the default terms.</p>
    <div class="ptiles">${PTYPES.map(p => `<div class="ptile ${d.ptype === p.id ? 'on' : ''}" data-act="wizType" data-v="${p.id}"><b>${esc(p.name)} Proposal</b><span>${esc(p.desc)}</span></div>`).join('')}</div>${E('ptype')}`;
  if (w.step === 1) body = `<div class="field"><label>Customer</label><select class="pin" data-wiz="cust" data-act="wizCust">${CUSTOMERS.map(c => `<option value="${c.id}" ${c.id === d.cust ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></div>
    <div class="field ${bad('toAddr')}"><label>Address, as it prints</label><textarea class="pin" data-wiz="toAddr" style="min-height:76px">${esc(d.toAddr)}</textarea>${E('toAddr')}</div>
    <h4 style="font-size:12px;margin:14px 0 2px">Kind attention</h4>
    <div class="g2">${F('attn.n', 'Name', d.attn.n, 'placeholder="Mr. R. Patwardhan"')}${F('attn.r', 'Designation', d.attn.r, 'placeholder="Manager"')}</div>
    <div class="g2">${F('attn.e', 'Email', d.attn.e)}${F('attn.p', 'Mobile', d.attn.p)}</div>
    <div class="hint">Pick a saved contact: ${cust(d.cust).contacts.map((k, i) => `<button class="btn sm" data-act="wizContact" data-i="${i}">${esc(k.n)}</button>`).join(' ')}</div>`;
  if (w.step === 2) body = `${F('subject', 'Subject, prints in capitals', d.subject, 'placeholder="Installation and Commissioning of ECMS009 NEXXT Ethanol % Monitoring System"')}
    <div class="field ${bad('intro')}"><label>Opening paragraph</label><textarea class="pin" data-wiz="intro" style="min-height:96px">${esc(d.intro)}</textarea>${E('intro')}</div>
    <div class="hint">Prints under Dear Sir.</div>`;
  if (w.step === 3) {
    const dq = wizQuote(), cal = quoteCalc(dq);
    body = `<div class="wline head"><span>Item description</span><span class="r">Qty</span><span>Unit</span><span class="hide-s">Vendor</span><span class="r">Cost /unit</span><span class="r">Margin</span><span class="r">Amount</span><span></span></div>
      ${d.lines.map((l, i) => { const lc = cal.lines[i], low = lc.ok && lc.gm < S().floor - 1e-9; return `<div class="wline">
        <input class="pin" data-wiz="line.${i}.d" value="${esc(l.d)}" placeholder="What is being supplied or done">
        <input class="pin r" data-wiz="line.${i}.q" value="${l.q}">
        <input class="pin" data-wiz="line.${i}.u" value="${esc(l.u)}">
        <select class="pin hide-s" data-wiz="line.${i}.v">${VENDORS.map(v => `<option value="${v.id}" ${v.id === l.v ? 'selected' : ''}>${esc(v.name)}</option>`).join('')}</select>
        <input class="pin r" data-wiz="line.${i}.c" value="${l.c == null ? '' : l.c}" placeholder="pending">
        <input class="pin r" data-wiz="line.${i}.m" value="${l.m}" title="${S().basis === 'markup' ? 'Markup on cost' : 'Margin on sale'}">
        <span class="mini">${lc.ok ? inr(lc.sell) : '–'}${low ? '<br><span style="color:var(--red);font-weight:700">low</span>' : ''}</span>
        <button class="btn sm" data-act="wizDelLine" data-i="${i}" title="Remove" style="padding:4px 7px">✕</button></div>
        ${er['line.' + i] ? `<span class="err" style="margin:-2px 0 7px">${esc(er['line.' + i])}</span>` : ''}`; }).join('')}
      <div class="btnrow"><button class="btn sm" data-act="wizAddLine">${ico('plus')} Add line</button>
        <span class="hint">Leave cost blank if not priced. ${E('lines')}</span></div>
      <div class="totals"><div class="tot"><div class="lbl">Value ex GST</div><div class="val">${cal.incomplete ? '–' : inr(cal.sell)}</div></div>
        ${can('viewMargin') ? `<div class="tot ${cal.needsApproval ? 'bad' : 'hi'}"><div class="lbl">Margin</div><div class="val">${inr(cal.margin)}</div></div>` : ''}
        <div class="tot"><div class="lbl">GST ${S().gst}%</div><div class="val">${inr(cal.gst)}</div></div>
        <div class="tot hi"><div class="lbl">Grand total</div><div class="val">${inr(cal.grand)}</div></div></div>
      ${cal.needsApproval ? `<div class="note">One or more lines are below the ${S().floor}% floor. The quotation can still be created, but it cannot go to the customer until the Owner or the Sales Manager approves it.</div>` : ''}`;
  }
  if (w.step === 4) body = `<div class="g2">${F('terms.validity', 'Offer validity', d.terms.validity)}${F('terms.taxes', 'Taxes', d.terms.taxes)}</div>
    ${F('terms.delivery', 'Delivery', d.terms.delivery)}
    <div class="field ${bad('terms.payment')}"><label>Payment terms</label><textarea class="pin" data-wiz="terms.payment" style="min-height:58px">${esc(d.terms.payment)}</textarea>${E('terms.payment')}</div>
    <div class="g2">${F('terms.trials', 'Trials and inspection', d.terms.trials)}${F('terms.packing', 'Packing and forwarding', d.terms.packing)}</div>
    <div class="field"><label>Warranty</label><textarea class="pin" data-wiz="terms.warranty" style="min-height:74px">${esc(d.terms.warranty)}</textarea></div>
    <div class="hint">GST, HSN and billing address print automatically.</div>`;
  if (w.step === 5) { const dq = wizQuote(), cal = quoteCalc(dq);
    body = `${cal.incomplete ? errBox('Some lines are not priced', 'They will print as "to be confirmed" until Sourcing fills the cost in.') : ''}
      ${cal.needsApproval && can('viewMargin') ? errBox('Below the margin floor', `This will be created with an approval flag and cannot be emailed until it is approved.`) : ''}
      ${quoteDoc(dq)}`; }

  openModal(`<div class="wiz"><h3>New quotation</h3>
    <div class="wz-steps">${WSTEPS.map((s, i) => `<span class="wz-step ${i === w.step ? 'on' : ''} ${i < w.step ? 'done' : ''}" data-act="wizStep" data-v="${i}"><i>${i < w.step ? '✓' : i + 1}</i>${s}</span>`).join('')}</div>
    <div class="wz-body">${body}</div>
    <div class="wz-foot">${w.step > 0 ? '<button class="btn" data-act="wizBack">Back</button>' : ''}<button class="btn" data-act="wizCancel">Cancel</button>
      <span class="spacer"></span><span class="hint">${esc(d.refBase)}-01 · ${d.ptype ? esc(PTYPE(d.ptype).name) + ' proposal' : 'pick a type'}</span>
      ${w.step < 5 ? '<button class="btn primary" data-act="wizNext">Continue</button>'
        : `<button class="btn" data-act="wizSave" data-mail="0">Save as draft</button><button class="btn primary" data-act="wizSave" data-mail="1">${ico('mail')} Create and email</button>`}</div></div>`);
  document.getElementById('modal').classList.add('wide');
}
function wizSave(sendAfter){
  wizCollect();
  for (let s = 0; s <= 4; s++) if (!wizValidate(s)) { state.wiz.step = s; wizRender(); fail('Something is missing', 'The step with the problem is open.'); return; }
  const d = state.wiz.d;
  const q = Object.assign(Q(d.refBase, d.cust, d.subject, d.owner, 0, [iso(TODAY)], d.lines.map(l => Object.assign({}, l))),
    {ptype:d.ptype, subject:d.subject, refBase:d.refBase, attn:Object.assign({}, d.attn), toAddr:d.toAddr, terms:Object.assign({}, d.terms), intro:d.intro, sent:null});
  QUOTES.unshift(q);
  log(q, `Quotation created by ${userName(state.userId)} as a ${PTYPE(d.ptype).name.toLowerCase()} proposal`);
  state.wiz.open = false; closeModal();
  state.tab = 'quotations'; state.quoteId = q.id; state.doorTab = sendAfter ? 'doc' : 'overview'; state.jAnimDone = false;
  render();
  okT(`${qref(q)} created`, sendAfter ? 'Check the document, then send it.' : 'Saved as a draft at Enquiry received.');
  if (sendAfter) setTimeout(mailOpen, 60);
}

/* ===================== SIGN IN ===================== */
function loginView(){
  const a = state.auth;
  return `<div class="lg"><img src="${LOGO_SRC()}" alt="VTRANSYS">
    <h1>Sales CRM</h1>
    <p class="sub">Use your VTransys Microsoft 365 account.</p>
    ${a.error ? errBox(a.error.t, a.error.b) : ''}
    <button class="msbtn" data-act="ssoIn" ${a.busy ? 'disabled' : ''}>
      ${a.busy ? '<span class="spin"></span>' : '<span class="ms"><i style="background:#f25022"></i><i style="background:#7fba00"></i><i style="background:#00a4ef"></i><i style="background:#ffb900"></i></span>'}
      ${a.busy ? 'Taking you to Microsoft' : 'Sign in with Microsoft'}</button>
    <button class="alt" data-act="ssoOther" ${a.busy ? 'disabled' : ''}>Use a different account</button>
    <div class="tenant">${ico('shield')}<span>Only <b>${esc(a.tenant)}</b> accounts are allowed.</span></div></div>`;
}

/* ===================== NEW ACTIONS ===================== */
(QUOTES.find(q => q.id === 'VQ-2026-0147') || {}).remoteEdit = {who:'u2', at:'2026-11-25'};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  const q = state.quoteId ? QUOTES.find(x => x.id === state.quoteId) : null;
  switch (act) {
    /* ---- filters and the door ---- */
    case 'clearLookup': state.custSearch = ''; render(); break;
    case 'goSec': { const t = document.getElementById(v); if (t && t.scrollIntoView) t.scrollIntoView({behavior:'smooth', block:'start'}); break; }
    case 'pfilter': state.filters.ptype = v; render(); break;
    case 'goFilter': state.filters = {stage:'all', cust:'all', owner:'all', status:el.dataset.status, ptype:'all', q:''};
      state.quoteId = null; go('quotations'); break;
    case 'goStage': state.filters = {stage:el.dataset.stage, cust:'all', owner:'all', status:'all', ptype:'all', q:''};
      state.quoteId = null; go('quotations'); break;
    case 'goCust': state.openCust = el.dataset.id; go('customers'); showRecord(); break;
    case 'sfilter': state.filters.stage = v; render(); break;
    case 'clearFilters': state.filters = {stage:'all', cust:'all', owner:'all', status:'all', ptype:'all', q:''}; render(); break;
    case 'doorTab': state.doorTab = v; render(); break;
    case 'reloadQuote': if (q) { delete q.remoteEdit; render(); okT('Reloaded', 'You now have the latest version of this quotation.'); } break;

    /* ---- wizard ---- */
    case 'wizOpen': wizOpen(); break;
    case 'wizType': wizCollect(); state.wiz.d.ptype = v; state.wiz.err = {}; wizRender(); break;
    case 'wizCust': break;
    case 'wizContact': { wizCollect(); const k = cust(state.wiz.d.cust).contacts[Number(el.dataset.i)];
      if (k) { state.wiz.d.attn = {n:k.n, r:k.r, e:k.e, p:k.p}; state.wiz.err = {}; wizRender(); } break; }
    case 'wizStep': { wizCollect(); const t = Number(v);
      if (t > state.wiz.step) { for (let s = state.wiz.step; s < t; s++) if (!wizValidate(s)) { state.wiz.step = s; wizRender(); return; } }
      state.wiz.step = t; state.wiz.err = {}; wizRender(); break; }
    case 'wizNext': wizCollect(); if (wizValidate(state.wiz.step)) { state.wiz.step++; state.wiz.err = {}; } wizRender(); break;
    case 'wizBack': wizCollect(); state.wiz.step = Math.max(0, state.wiz.step - 1); state.wiz.err = {}; wizRender(); break;
    case 'wizAddLine': wizCollect(); state.wiz.d.lines.push({d:'', q:1, u:'nos', v:'v1', c:null, t:'pct', m:S().floor + 4}); wizRender(); break;
    case 'wizDelLine': { wizCollect();
      if (state.wiz.d.lines.length < 2) { fail('A quotation needs at least one line', 'Edit this line instead of removing it.'); return; }
      state.wiz.d.lines.splice(Number(el.dataset.i), 1); wizRender(); break; }
    case 'wizSave': wizSave(el.dataset.mail === '1'); break;
    case 'wizCancel': { wizCollect(); const dd = state.wiz.d;
      if (!dd.subject && !dd.lines.some(l => l.d)) { state.wiz.open = false; closeModal(); break; }
      openModal(`<h3>Discard this quotation?</h3><p class="lead" style="margin:0 0 4px">Nothing has been saved yet. Everything you typed will be lost.</p>
        <div class="btnrow" style="margin-bottom:0"><button class="btn danger" data-act="wizDiscard">Discard it</button><button class="btn" data-act="wizKeep">Keep editing</button></div>`);
      break; }
    case 'wizDiscard': state.wiz.open = false; closeModal(); break;
    case 'wizKeep': wizRender(); break;

    /* ---- outlook ---- */
    case 'mailOpen': mailOpen(); break;
    case 'mailSend': mailSend(); break;
    case 'mailReconnect': state.mail.connected = true; closeModal(); render(); okT('Outlook reconnected', `Sending as ${state.mail.account}.`); break;
    case 'mailDisconnect': confirmDo({title:'Disconnect Outlook?', body:'Nobody will be able to email a quotation from the CRM until it is reconnected.',
        label:'Disconnect', danger:true, fn:() => { state.mail.connected = false; render(); fail('Outlook disconnected', 'Quotations can still be created, but not emailed.'); }}); break;
    case 'mailFail': state.mail.failNext = !state.mail.failNext; render(); break;
    case 'mailFailOff': state.mail.failNext = false; mailOpen(); break;

    /* ---- confirmations ---- */
    case 'confirmYes': { const f = _confirmFn; _confirmFn = null; closeModal(); if (f) f(); break; }

    /* ---- AMC ---- */
    case 'amcDraft': { const c = cust(el.dataset.cust); if (!c) break;
      wizOpen({ptype:'services', cust:c.id, toAddr:c.addr,
        attn:{n:c.contacts[0].n, r:c.contacts[0].r, e:c.contacts[0].e, p:c.contacts[0].p},
        subject:'Annual Maintenance Contract for ' + el.dataset.item,
        intro:'This is with reference to the system supplied and commissioned by us at your plant. As the warranty period is coming to an end, we are pleased to submit our offer for an annual maintenance contract.',
        lines:[{d:'Annual maintenance contract: two preventive visits, calibration and telephonic support for 12 months', q:1, u:'Year', v:'v7', c:null, t:'pct', m:S().floor + 12}]});
      if (state.wiz.open) { state.wiz.step = 2; wizRender(); }
      break; }

    /* ---- sign in ---- */
    case 'ssoIn': {
      if (state.auth.busy) break;
      state.auth.busy = true; state.auth.error = null; render();
      setTimeout(() => { state.auth.busy = false; state.auth.signedIn = true; state.auth.at = Date.now(); render();
        okT(`Signed in as ${me().name}`, `Microsoft 365 on ${state.auth.tenant}.`); }, 850);
      break; }
    case 'ssoOther':
      state.auth.error = {t:'That account cannot use this CRM', b:`Only accounts on ${state.auth.tenant} are allowed. Personal Microsoft accounts and other tenants are refused.`};
      render(); break;
    case 'expireSession':
      state.auth.signedIn = false; state.auth.error = {t:'Your session ended', b:`Sessions end after ${state.auth.sessionHrs} hours of inactivity. Sign in again to carry on.`};
      closeModal(); render(); break;
  }
});

/* search box inside the quotation rail */
document.addEventListener('input', e => {
  if (e.target.id === 'qSearch') {
    state.filters.q = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const el = document.getElementById('qSearch');
    if (el) { el.focus(); el.setSelectionRange(pos, pos); }
  }
});
/* going back online pushes whatever was held on the device */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act="offline"]');
  if (el && !state.offline) setTimeout(flushQueue, 30);
});

/* ===================== RENDER WITH THE SIGN IN GATE ===================== */
function render(){
  const lg = document.getElementById('login'), app = document.querySelector('.app');
  if (!state.auth.signedIn) {
    lg.className = 'show'; lg.innerHTML = loginView();
    if (app) app.style.display = 'none';
    return;
  }
  lg.className = ''; lg.innerHTML = '';
  if (app) app.style.display = '';
  renderTabs(); renderUsers();
  const page = document.getElementById('page');
  const v = {dashboard:viewDashboard, quotations:viewQuotations, customers:viewCustomers, vendors:viewVendors, reports:viewReports, settings:viewSettings}[state.tab]
    || viewDashboard;
  try {
    page.innerHTML = v() + footer();
  } catch (err) {
    page.innerHTML = `<div class="bento"><div class="b s12">${errBox('This screen could not be drawn', String(err && err.message || err))}
      <div class="btnrow" style="margin-bottom:0"><button class="btn" data-act="tab" data-tab="dashboard">Back to the dashboard</button></div></div></div>`;
  }
  try { if (location.hash.slice(1) !== state.tab) history.replaceState(null, '', '#' + state.tab); } catch (e) {}
  centreLiveStage();
}
/* on a narrow screen the journey scrolls, so bring the live stage into view */
function centreLiveStage(){
  try {
    document.querySelectorAll('.jpwrap[data-live]').forEach(el => {
      const over = el.scrollWidth - el.clientWidth;
      if (over < 8) return;
      el.scrollLeft = Math.max(0, Math.min(over, parseFloat(el.dataset.live) * el.scrollWidth - el.clientWidth / 2));
    });
  } catch (e) {}
}


/* prototype debug hook, lets support inspect live state from the console */
window.VTCRM = {state, QUOTES, CUSTOMERS, VENDORS, ORDERS, render, visibleQuotes, quoteCalc, qref, amcAll};
(function init(){ const h = location.hash.slice(1); if (TABS.some(t => t[0] === h)) state.tab = h;
  if (location.search.indexOf('signedin') > -1) state.auth.signedIn = true;
  render(); })();
</script>
