<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VTRANSYS CRM, prototype by Plinthera</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f7; --surface:#ffffff; --bg-2:#f7f8fa; --bg-3:#eceef2;
  --line:#e4e7ec; --line-2:#d3d8e0; --track:#edeff3;
  --sh-d:#e4e7ec; --sh-l:#ffffff;
  --text:#14171c; --text-2:#5a6372; --text-3:#8b94a3;
  --accent:#d12028; --accent-2:#a8151f; --accent-soft:#fdeceb; --accent-ink:#b31a22; --ink:#14171c;
  --green:#178f64; --green-soft:#e2f4ec; --amber:#c47a16; --amber-soft:#fcf0dd; --red:#d12028; --red-soft:#fdeae8; --violet:#7a3fa0; --grey-soft:#eceef2;
  --c1:#d12028; --c2:#b86a10; --c3:#7a3fa0; --c4:#178f64; --c5:#2f66b8;
  --r:16px; --r-md:12px; --r-sm:8px;
  --raise:0 1px 2px rgba(18,24,40,.05);
  --raise-sm:0 1px 2px rgba(18,24,40,.04);
  --raise-xs:none;
  --lift:0 6px 16px rgba(18,24,40,.09);
  --inset:inset 0 0 0 1px var(--line-2);
  --inset-sm:inset 0 0 0 1px var(--line);
  --inset-xs:inset 0 0 0 1px var(--line);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'IBM Plex Sans',system-ui,sans-serif; font-size:14px; color:var(--text); line-height:1.5; background:var(--bg); min-height:100vh; -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0; font-weight:700; letter-spacing:-.01em}
.mono,.num{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; letter-spacing:-.01em}
a{color:var(--accent-ink)}
button{font:inherit; color:inherit}
svg.i{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; flex:none}

/* ---------- App shell ---------- */
.app{display:grid; grid-template-columns:264px minmax(0,1fr); min-height:100vh}
.app>*{min-width:0}
.side{position:sticky; top:0; height:100vh; display:flex; flex-direction:column; padding:28px 22px 22px; gap:10px}
.logo{display:flex; flex-direction:column; gap:10px; padding:6px 6px 22px}
.logo img{width:100%; max-width:200px; height:auto; display:block}
.logo .cap{font-weight:600; font-size:10.5px; color:var(--text-3); letter-spacing:.16em; text-transform:uppercase; padding-left:2px}
.tabs{display:flex; flex-direction:column; gap:8px}
.tab{display:flex; align-items:center; gap:14px; width:100%; text-align:left; cursor:pointer; border:0; background:transparent; border-radius:var(--r-md); padding:13px 16px; font-weight:600; font-size:14.5px; color:var(--text-2); transition:box-shadow .15s,color .15s,transform .15s}
.tab:hover{box-shadow:var(--raise-sm); color:var(--text)}
.tab.active{box-shadow:var(--inset); color:var(--accent-ink)}
.tab.active svg.i{stroke:var(--accent)}
.tab .lbl{flex:1}
.tab .cnt{min-width:22px; height:22px; padding:0 7px; border-radius:11px; display:grid; place-items:center; font-size:11.5px; font-weight:700; color:#fff; background:linear-gradient(135deg,#3a3a3a,#151515); box-shadow:2px 2px 5px rgba(15,15,15,.3)}
.tab .cnt.alert{background:linear-gradient(135deg,#e8343c,#a8151f); box-shadow:2px 2px 5px rgba(209,32,40,.35)}
.side .spacer{flex:1}
.usercard{border-radius:var(--r); padding:14px; box-shadow:var(--raise); display:flex; flex-direction:column; gap:10px}
.usercard .who{display:flex; align-items:center; gap:12px}
.avatar{width:40px; height:40px; border-radius:50%; display:grid; place-items:center; font-weight:800; font-size:13px; color:var(--accent-ink); background:var(--bg); box-shadow:var(--inset-sm); flex:none}
.usercard .nm{font-weight:700; font-size:13.5px; line-height:1.2}
.usercard .rl{font-size:12px; color:var(--text-3)}
.usercard label{font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--text-3)}
.usercard select.pin{font-size:12.5px; padding:9px 30px 9px 12px}
.main{min-width:0; padding:26px 34px 40px}
.topbar{display:flex; align-items:center; gap:14px; margin-bottom:22px}
.topbar .spacer{flex:1}
.search{display:flex; align-items:center; gap:10px; border-radius:999px; padding:0 18px; height:46px; width:360px; box-shadow:var(--inset); color:var(--text-3)}
.search input{background:transparent; border:0; outline:0; font:inherit; font-size:14px; color:var(--text); flex:1; min-width:0}
.search input::placeholder{color:var(--text-3)}
.led{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;background:var(--c,#999);box-shadow:0 0 0 3px color-mix(in srgb,var(--c,#999) 22%,transparent)}
.led.green{--c:#22b573}.led.red{--c:#e0453a}.led.amber{--c:#f0a92c}.led.grey{--c:#aab2c0}
.led.blink{animation:blink 2.4s infinite}
@keyframes blink{0%,75%{opacity:1}88%{opacity:.35}100%{opacity:1}}
.page{min-width:0}
.page h2{font-size:24px; margin-bottom:2px; letter-spacing:-.02em}
.page h3{font-size:15px; font-weight:700; margin:0 0 14px; display:flex; align-items:center; gap:10px; color:var(--text)}
.page h3 .sub{font-weight:500; font-size:12.5px; color:var(--text-3)}
.lead{color:var(--text-2); margin:0 0 22px; font-size:14px}
.row{display:flex; gap:22px; flex-wrap:wrap; align-items:flex-start}
.grow{flex:1 1 360px; min-width:0}
.panel,.card-x{border-radius:var(--r); padding:22px 24px; box-shadow:var(--raise); background:var(--bg)}
.section{border-radius:var(--r); padding:22px 24px; box-shadow:var(--raise); margin-bottom:22px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex; align-items:center; gap:8px; cursor:pointer; user-select:none; font-weight:700; font-size:13.5px; color:var(--text); padding:11px 20px; border-radius:var(--r-md); border:0; background:var(--bg); box-shadow:var(--raise-sm); transition:box-shadow .12s,transform .12s,color .12s; white-space:nowrap}
.btn:hover{color:var(--accent-ink)}
.btn:active{box-shadow:var(--inset-sm); transform:translateY(1px)}
.btn.primary{color:#fff; background:linear-gradient(135deg,#e8343c,#b3171f); box-shadow:4px 4px 10px rgba(209,32,40,.32), -4px -4px 10px var(--sh-l)}
.btn.primary:hover{color:#fff; filter:brightness(1.05)}
.btn.primary:active{box-shadow:inset 3px 3px 6px rgba(0,0,0,.25)}
.btn.danger{color:#fff; background:linear-gradient(135deg,#3a3a3a,#151515); box-shadow:4px 4px 10px rgba(15,15,15,.3), -4px -4px 10px var(--sh-l)}
.btn.danger:hover{color:#fff}
.btn.success{color:#fff; background:linear-gradient(135deg,#2fb57f,#178f64); box-shadow:4px 4px 10px rgba(23,143,100,.3), -4px -4px 10px var(--sh-l)}
.btn.success:hover{color:#fff}
.btn.sm{font-size:12.5px; padding:8px 14px; border-radius:var(--r-sm)}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.btn[disabled]:active{box-shadow:var(--raise-sm); transform:none}
.btnrow{display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin:14px 0}

/* ---------- Inputs ---------- */
.pin{font:inherit; font-size:13.5px; color:var(--text); background:var(--bg); border:0; border-radius:var(--r-sm); padding:10px 14px; outline:0; width:100%; min-width:50px; box-shadow:var(--inset-sm); transition:box-shadow .12s}
.pin.r,.pin[type=number]{text-align:right; font-variant-numeric:tabular-nums}
.pin:focus{box-shadow:var(--inset-sm), 0 0 0 3px var(--accent-soft)}
.pin[disabled],.pin[readonly]{color:var(--text-3); box-shadow:var(--inset-xs); cursor:not-allowed}
select.pin{cursor:pointer; appearance:none; -webkit-appearance:none; padding-right:34px; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%238b95a7' stroke-width='1.8' stroke-linecap='round'/></svg>"); background-repeat:no-repeat; background-position:right 14px center}
select.pin[disabled]{background-image:none}
input[type=radio]{accent-color:var(--accent); width:16px; height:16px; vertical-align:-2px; margin-right:8px}
.chip{display:inline-block; font-size:11.5px; font-weight:600; padding:4px 11px; border-radius:999px; color:var(--text-2); box-shadow:var(--inset-xs); white-space:nowrap}
.chip.role{color:var(--accent-ink)}

/* ---------- Tables ---------- */
.tablewrap{overflow-x:auto; border-radius:var(--r); box-shadow:var(--raise); padding:6px 4px}
.ledger{width:100%; border-collapse:separate; border-spacing:0; font-size:13.5px}
.ledger th{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-3); text-align:left; padding:14px 14px 10px; border-bottom:1px solid var(--bg-3); white-space:nowrap}
.ledger td{padding:13px 14px; border-bottom:1px solid var(--bg-3); vertical-align:middle}
.ledger tbody tr:last-child td{border-bottom:0}
.ledger td.r,.ledger th.r{text-align:right}
.ledger td.num{white-space:nowrap}
.ledger tr.click{cursor:pointer; transition:background .1s}
.ledger tr.click:hover td{background:rgba(255,255,255,.5)}
.ledger tr.click:hover td:first-child{border-radius:12px 0 0 12px}
.ledger tr.click:hover td:last-child{border-radius:0 12px 12px 0}
.ledger tfoot td{font-weight:700; border-top:2px solid var(--bg-3); border-bottom:0}
.ledger .muted{color:var(--text-3)}
.ledger.lines th,.ledger.lines td{padding:10px 7px}
.ledger.lines th:first-child,.ledger.lines td:first-child{padding-left:6px}
.alist{display:flex; flex-direction:column; gap:12px}
.aitem{display:grid; grid-template-columns:140px 1.5fr auto 1fr auto; gap:14px; align-items:center; padding:13px 18px; border-radius:var(--r-md); box-shadow:var(--raise-sm); cursor:pointer; transition:box-shadow .12s}
.aitem:hover{box-shadow:var(--raise)}
.aitem .a-id .num{display:block; font-weight:600; font-size:13px}
.aitem .a-cust{font-size:12.5px; color:var(--text-2)}
.aitem .a-stage b{display:block; font-size:13px; font-weight:700; white-space:nowrap}
.aitem .a-stage span{font-size:12px; color:var(--text-3)}
.aitem .a-who{font-size:13px; font-weight:600}
.aitem .a-who span{display:block; font-size:11.5px; color:var(--text-3); font-weight:500}
.aitem .over{color:var(--red); font-weight:700}
.folder .sheet .tablewrap{box-shadow:none; padding:0}
.locked{color:var(--text-3); font-size:12.5px; display:inline-flex; align-items:center; gap:6px}
.locked:before{content:""; width:12px; height:12px; flex:none; background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238b95a7' stroke-width='2.2' stroke-linecap='round'><rect x='3' y='11' width='18' height='11' rx='2'/><path d='M7 11V7a5 5 0 0 1 10 0v4'/></svg>") center/contain no-repeat}

/* ---------- Status pills ---------- */
.stamp{display:inline-flex; align-items:center; gap:7px; font-size:11.5px; font-weight:700; letter-spacing:.02em; padding:5px 12px 5px 10px; border-radius:999px; white-space:nowrap; color:var(--pc); background:var(--pb); box-shadow:var(--raise-xs)}
.stamp:before{content:""; width:7px; height:7px; border-radius:50%; background:var(--pc)}
.stamp.red{--pc:#a8151f;--pb:var(--red-soft)}.stamp.green{--pc:#136f4e;--pb:var(--green-soft)}.stamp.blue{--pc:#2f5a9c;--pb:#dfe8f5}.stamp.amber{--pc:#9a5e0f;--pb:var(--amber-soft)}.stamp.grey{--pc:#5b6577;--pb:var(--grey-soft)}
.stamp.big{font-size:13px; padding:8px 16px 8px 13px}

/* ---------- KPI tiles ---------- */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:22px; margin:0 0 24px}
.tile{border-radius:var(--r); padding:20px 22px; box-shadow:var(--raise); display:flex; flex-direction:column; gap:6px; position:relative; min-height:150px}
.tile .ico{width:44px; height:44px; border-radius:14px; display:grid; place-items:center; box-shadow:var(--inset-sm); color:var(--accent); margin-bottom:6px}
.tile.alert .ico{color:var(--red)}
.tile.good .ico{color:var(--green)}
.tile .lbl{font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-3)}
.tile .val{font-size:30px; font-weight:800; letter-spacing:-.03em; line-height:1.1}
.tile .val small{font-size:13px; font-weight:600; color:var(--text-2); letter-spacing:0}
.tile .foot{font-size:12.5px; color:var(--text-3)}
.tile.alert .val{color:var(--red)}
.tile.ring{flex-direction:row; align-items:center; gap:16px}
.tile.sm{padding:16px 18px; min-height:0; gap:4px}
.tile.sm .ico{width:36px; height:36px; border-radius:11px; margin-bottom:2px}
.tile.sm .ico svg.i{width:17px; height:17px}
.tile.sm .val{font-size:24px}
.tile.sm .lbl{font-size:11px}
.tile.hero{justify-content:space-between}
.tile.hero .val{font-size:40px}
.tile.hero .spark{width:100%; height:56px; display:block; margin-top:6px}
.tile.hero .split{display:flex; gap:14px; font-size:12.5px; color:var(--text-2); font-weight:600; flex-wrap:wrap}
.tile.hero .split i{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px}
.tile.ring.col{flex-direction:column; align-items:center; text-align:center; justify-content:center; gap:4px}
.tile.ring.col .gauge{width:104px; height:104px}
.tile.ring .ringwrap{flex:none}
.gauge{width:96px; height:96px; display:block}

/* ---------- Pipeline ---------- */

/* ---------- Journey ---------- */
.journey{display:grid; grid-template-columns:repeat(var(--n,6),1fr); gap:0; margin:6px 0 10px; position:relative}
.journey:before{content:""; position:absolute; left:5%; right:5%; top:16px; height:10px; border-radius:5px; box-shadow:var(--inset-sm)}
.step{position:relative; text-align:center; padding:0 4px; min-width:0}
.step .pin2{width:22px; height:22px; border-radius:50%; margin:10px auto 12px; position:relative; z-index:1; background:var(--bg); box-shadow:var(--raise-xs)}
.step .pin2:after{content:""; position:absolute; inset:6px; border-radius:50%; background:var(--bg-3)}
.step.done .pin2:after{background:var(--green)}
.step.cur .pin2:after{background:var(--ink); box-shadow:0 0 0 4px rgba(15,15,15,.12)}
.step.stuck .pin2:after{background:var(--red); box-shadow:0 0 0 4px var(--red-soft)}
.step .tag{border-radius:var(--r-sm); padding:10px 6px; font-size:11.5px; line-height:1.35; min-height:92px; box-shadow:var(--raise-xs)}
.step .tag b{display:block; font-size:12px; font-weight:700; margin-bottom:3px}
.step .tag .d{font-size:11px; color:var(--text-2)}
.step.pending .tag{box-shadow:none; opacity:.7; border:1.5px dashed var(--sh-d)}
.step.stuck .tag{background:var(--red-soft)}
.step.cur .tag{background:#fff}
.mini{display:inline-flex; gap:3px; align-items:center; vertical-align:middle}
.mini i{width:8px; height:8px; border-radius:50%; background:var(--bg-3); display:inline-block}
.mini i.stuck{background:var(--red); box-shadow:0 0 0 2px var(--red-soft)}
.sdot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:7px; vertical-align:1px; flex:none}

/* ---------- Record (quotation detail) ---------- */
.folder{border-radius:var(--r); padding:24px 26px; position:relative; box-shadow:var(--raise); margin-top:6px}
.folder:before{content:attr(data-label); display:inline-block; font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--text-3); margin-bottom:10px}
.folder .sheet{border-radius:var(--r); padding:18px 18px; margin-top:16px; box-shadow:var(--inset)}
.ftabs{display:inline-flex; gap:6px; border-radius:999px; padding:6px; box-shadow:var(--inset-sm)}
.ftab{padding:9px 18px; border-radius:999px; cursor:pointer; font-weight:700; font-size:13px; color:var(--text-2); transition:box-shadow .12s,color .12s}
.ftab.active{box-shadow:var(--raise-sm); color:var(--accent-ink)}
.kv{display:grid; grid-template-columns:auto 1fr; gap:6px 16px; font-size:13.5px}
.kv dt{color:var(--text-3); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; padding-top:3px}
.kv dd{margin:0}
.totals{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-top:16px}
.tot{border-radius:var(--r-md); padding:12px 16px; box-shadow:var(--inset-sm)}
.tot .lbl{font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-3)}
.tot .val{font-size:18px; font-weight:800; margin-top:3px; letter-spacing:-.01em}
.tot.hi{color:var(--text)} .tot.hi .val{font-size:20px}
.tot.bad .val{color:var(--red)}
.warn,.ok,.note{position:relative; padding:12px 16px 12px 38px; border-radius:var(--r-md); margin:12px 0; font-size:13.5px; box-shadow:var(--raise-xs)}
.warn:before,.ok:before,.note:before{content:""; position:absolute; left:16px; top:18px; width:10px; height:10px; border-radius:50%}
.warn{background:var(--red-soft); color:#7d2a26}.warn:before{background:var(--red)}
.ok{background:var(--green-soft); color:#135a40}.ok:before{background:var(--green)}
.note{background:var(--amber-soft); color:#6b430c}.note:before{background:var(--amber)}
.feed{list-style:none; margin:0; padding:0}
.feed li{display:grid; grid-template-columns:110px 1fr; gap:12px; padding:10px 0; border-bottom:1px solid var(--bg-3); font-size:13.5px}
.feed li:last-child{border-bottom:0}
.feed .when{font-size:12px; color:var(--text-3); font-weight:600; padding-top:1px}
.feed .who{color:var(--text-2)}
.feed .who b{color:var(--text); font-weight:700}

/* ---------- Cards (customers, vendors) ---------- */
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:22px; margin-top:6px}
.card{border-radius:var(--r); padding:20px; position:relative; box-shadow:var(--raise); cursor:pointer; transition:transform .12s,box-shadow .12s; display:flex; flex-direction:column; gap:4px}
.card:hover{transform:translateY(-2px)}
.card .av{width:44px; height:44px; border-radius:14px; display:grid; place-items:center; font-weight:800; font-size:14px; color:#fff; background:var(--tabc,#8b95a7); margin-bottom:10px; box-shadow:3px 3px 8px rgba(0,0,0,.15)}
.card h4{font-size:15.5px; margin-bottom:0}
.card .meta{font-size:12.5px; color:var(--text-2)}
.card .foot{margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; font-size:12px}
.card.open{box-shadow:var(--inset); transform:none}
.card .holes{display:none}
.stars{color:var(--amber); letter-spacing:1px; font-size:12px}

/* ---------- Toggles ---------- */
.toggle{width:50px; height:28px; border-radius:14px; position:relative; cursor:pointer; display:inline-block; vertical-align:middle; box-shadow:var(--inset-sm); background:var(--bg); transition:background .15s}
.toggle .knob{position:absolute; top:4px; left:4px; width:20px; height:20px; border-radius:50%; transition:left .15s; background:var(--bg); box-shadow:var(--raise-xs)}
.toggle.on{background:linear-gradient(135deg,#3a3a3a,#151515); box-shadow:inset 2px 2px 5px rgba(0,0,0,.35)}
.toggle.on .knob{left:26px; background:#fff; box-shadow:1px 1px 3px rgba(0,0,0,.3)}
.toggle.disabled{opacity:.55; cursor:not-allowed}
.matrix td{text-align:center}
.matrix td:first-child{text-align:left}
.matrix th{text-align:center}
.matrix th:first-child{text-align:left}

/* ---------- Charts ---------- */
.chart{border-radius:var(--r); padding:20px 22px 14px; box-shadow:var(--raise); margin:0 0 22px}
.chart h4{font-size:14.5px; margin-bottom:2px; display:flex; justify-content:space-between; align-items:center; gap:8px}
.chart .cap{font-size:12.5px; color:var(--text-3); margin-bottom:8px}
.chart svg{width:100%; height:auto; display:block; font-family:'Plus Jakarta Sans',sans-serif}
.legend{display:flex; gap:16px; font-size:12.5px; margin:4px 0 8px; flex-wrap:wrap; color:var(--text-2); font-weight:600}
.legend i{display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:6px; vertical-align:-1px}
.tbl-toggle{font-size:12px; font-weight:700; color:var(--accent-ink); cursor:pointer; padding:4px 10px; border-radius:999px; box-shadow:var(--raise-xs)}
.charttbl{display:none; margin-top:10px}
.charttbl.show{display:block}
#tip{position:fixed; z-index:50; pointer-events:none; background:#151515; color:#fff; font-size:12px; font-weight:600; padding:8px 11px; border-radius:10px; box-shadow:0 6px 16px rgba(0,0,0,.25); display:none; max-width:260px; white-space:pre-line}
.bar{cursor:pointer}
.bar:hover{filter:brightness(1.1)}

/* ---------- Modal, toast ---------- */
#modalwrap{position:fixed; inset:0; background:rgba(228,232,240,.72); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); display:none; align-items:center; justify-content:center; z-index:40; padding:16px}
#modalwrap.show{display:flex}
.modal{background:var(--bg); border-radius:24px; padding:26px 28px; max-width:780px; width:100%; max-height:90vh; overflow:auto; box-shadow:var(--raise), 0 30px 60px rgba(42,50,64,.18)}
.modal h3{margin:0 0 12px; font-size:18px}
.field{margin:10px 0}
.field label{display:block; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-3); margin-bottom:6px}
.field textarea.pin{min-height:80px; resize:vertical}
#toast{position:fixed; right:22px; bottom:22px; z-index:60; display:flex; flex-direction:column; gap:10px; align-items:flex-end}
.slip{background:var(--bg); border-radius:var(--r-md); padding:12px 16px 12px 14px; font-size:13.5px; font-weight:600; box-shadow:var(--raise), 0 14px 30px rgba(42,50,64,.15); animation:slipin .2s ease-out; max-width:360px; border-left:5px solid var(--accent)}
.slip.red{border-left-color:var(--red)}
.slip.green{border-left-color:var(--green)}
@keyframes slipin{from{transform:translateY(12px); opacity:0}to{transform:none; opacity:1}}

/* ---------- Customer-facing document ---------- */
.doc{background:#fff; border-radius:12px; padding:30px 34px; font-size:13px; color:#1c2128; box-shadow:var(--raise-sm)}
.doc .lh{display:flex; justify-content:space-between; border-bottom:2px solid #1c2128; padding-bottom:10px; margin-bottom:14px}
.doc .lh h2{font-size:20px}
.doc table{width:100%; border-collapse:collapse; margin-top:10px}
.doc th,.doc td{border:1px solid #d3d7dd; padding:6px 8px; font-size:12.5px}
.doc th{background:#f4f5f7; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.07em}
.doc .muted{color:#6b7280}

.foot-note{margin-top:30px; font-size:12px; color:var(--text-3); display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px; padding-top:16px}
.filters{display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; margin:0 0 22px; padding:18px 22px; border-radius:var(--r); box-shadow:var(--raise)}
.filters .field{margin:0; min-width:170px}
.filters .spacer{flex:1}
.hint{font-size:12.5px; color:var(--text-3)}
.empty{padding:28px; text-align:center; color:var(--text-3); font-size:13.5px; border-radius:var(--r-md); box-shadow:var(--inset-sm)}

/* ---------- Connection state, prototype strip ---------- */
.avatar{position:relative}
.avatar .st{position:absolute; right:-1px; bottom:-1px; width:12px; height:12px; border-radius:50%; background:#22b573; border:2px solid var(--bg)}
.avatar .st.off{background:#aab2c0}
.usercard .signout{font-size:12px; color:var(--text-3); cursor:pointer; margin-top:2px}
.usercard .signout:hover{color:var(--accent-ink)}
.netbanner{display:flex; align-items:center; gap:12px; padding:12px 18px; border-radius:var(--r-md); margin:-6px 0 18px; background:var(--amber-soft); color:#6b430c; font-size:13.5px; font-weight:600; box-shadow:var(--raise-xs)}
.netbanner[hidden]{display:none}
.proto{display:flex; align-items:center; gap:22px; flex-wrap:wrap; margin-top:34px; padding:12px 16px; border-radius:var(--r-md); border:1.5px dashed var(--sh-d); font-size:12.5px; color:var(--text-3)}
.proto .proto-l{font-weight:700; letter-spacing:.06em; text-transform:uppercase; font-size:10.5px}
.proto label{display:flex; align-items:center; gap:10px; color:var(--text-2); font-weight:600}
.proto select.pin{width:auto; min-width:220px; padding:6px 32px 6px 10px; font-size:12.5px}
.proto .toggle{width:40px; height:22px}
.proto .toggle .knob{width:16px; height:16px; top:3px; left:3px}
.proto .toggle.on .knob{left:21px}

/* ---------- Bento grid ---------- */
.bento{display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); grid-auto-rows:minmax(132px,auto); grid-auto-flow:dense; gap:20px; align-items:stretch; margin-bottom:20px}
.b{border-radius:var(--r); padding:20px 22px; box-shadow:var(--raise); background:var(--bg); min-width:0; display:flex; flex-direction:column}
.b>h3{margin:0 0 12px}
.b .bfill{flex:1}
.b .tablewrap{box-shadow:none; padding:0; border-radius:0}
.b .filters{box-shadow:none; padding:0; margin:0}
.b.chart{margin:0}
.b .btnrow:last-child{margin-bottom:0}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s9{grid-column:span 9}.s12{grid-column:span 12}
.r2{grid-row:span 2}
.eyebrow{font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--text-3); margin-bottom:6px}
.statusb{align-items:flex-start; gap:10px}
.statusb .stagename{font-weight:700; font-size:15px}
.statusb .substate{font-size:12.5px; color:var(--text-3); margin-top:-6px}
.statusb .btnrow{margin:6px 0 0}
@media (max-width:1240px){.s2{grid-column:span 4}.s3{grid-column:span 6}.s4,.s5,.s7,.s8,.s9{grid-column:span 12}.s6{grid-column:span 12}.r2{grid-row:auto}}
@media (max-width:980px){.s2{grid-column:span 6}.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s12{grid-column:span 12}.r2{grid-row:auto}.bento{gap:14px; grid-auto-rows:auto}.b{padding:16px 16px}}

.reps{display:flex; flex-direction:column; gap:14px}
.rep{border-radius:16px; padding:14px 16px; box-shadow:var(--inset-sm)}
.rep-h{display:flex; align-items:center; gap:12px; margin-bottom:12px}
.rep-h .rl{font-size:12px; color:var(--text-3)}
.rep-win{margin-left:auto; text-align:right; font-size:22px; font-weight:800; letter-spacing:-.02em; line-height:1}
.rep-win span{display:block; font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-3); margin-top:3px}
.rep-g{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
.rep-g span{display:block; font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-3)}
.rep-g b{font-size:15px; font-weight:700}
@media (max-width:980px){.rep-g{grid-template-columns:repeat(2,1fr)}}
/* ---------- Journey path (chevrons) ---------- */
.jpwrap{overflow-x:auto; margin:0 -4px; padding:4px 4px 2px}
.jp{width:100%; min-width:700px; height:auto; display:block; font-family:'IBM Plex Sans',sans-serif; overflow:visible}
.jp .chev{cursor:pointer; transform-box:fill-box; transform-origin:center; animation:jin .55s cubic-bezier(.22,1,.36,1) backwards; transition:transform .15s}
.jp .chev:hover{transform:translateY(-2px)}
.jp .chev.static,.jp .chev.static:hover{cursor:default; transform:none}
.jp .chev.noanim{animation:none}
.jp .sheen{animation:sweep 7s linear infinite 1.4s}
.jp .jname{font-size:9.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; fill:#5a5f6a}
.jp .jcount{font-size:20px; font-weight:800; fill:#151515; letter-spacing:-.02em}
.jp .jval{font-size:10px; font-weight:600; fill:#8a8f99}
.jp .jdate{font-size:11px; font-weight:700; fill:#151515}
.jp .sel .jname,.jp .current .jname{fill:rgba(255,255,255,.85)}
.jp .sel .jcount,.jp .sel .jval,.jp .sel .jdate,.jp .current .jcount,.jp .current .jval,.jp .current .jdate{fill:#fff}
.jp .pending .jname,.jp .pending .jcount,.jp .pending .jval,.jp .pending .jdate{fill:#aab0ba}
.jp .jbadge{transform-box:fill-box; transform-origin:center; animation:badge 1.8s ease-in-out infinite}
.jp .jmeta{font-size:10px; font-weight:600; fill:#5a5f6a}
.jp .jmeta2{font-size:9.5px; font-weight:500; fill:#8a8f99}
@keyframes jin{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}
@keyframes sweep{0%{transform:translateX(0)}60%,100%{transform:translateX(1500px)}}
@keyframes badge{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.jstage-title{display:flex; align-items:baseline; gap:10px; margin-top:14px; font-weight:700; font-size:14px}
.jstage-title .sub{font-weight:500; font-size:12.5px; color:var(--text-3)}
.jstrip{display:flex; gap:14px; overflow-x:auto; padding:8px 4px 12px; margin:4px -4px 0}
.jcard{flex:0 0 250px; border-radius:16px; padding:14px 16px; box-shadow:var(--raise-sm); cursor:pointer; transition:transform .12s, box-shadow .12s}
.jcard:hover{transform:translateY(-2px); box-shadow:var(--raise)}
.jc-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-weight:600; font-size:12.5px}
.jc-cust{font-weight:700; font-size:14px}
.jc-title{font-size:12.5px; color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.jc-foot{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:12px; font-size:12px; color:var(--text-3)}
.jc-own{width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-size:10.5px; font-weight:700; color:var(--accent-ink); box-shadow:var(--inset-xs)}
@media (prefers-reduced-motion:reduce){.jp .chev,.jp .sheen,.jp .jbadge{animation:none !important}}
.flow-legend{display:flex; gap:18px; font-size:12px; color:var(--text-2); font-weight:600; margin-top:6px; flex-wrap:wrap}
.flow-legend i{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:-1px}
@media (max-width:980px){
  .proto{gap:12px}
}

@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .side{position:static; height:auto; padding:16px 14px 6px; gap:10px}
  .logo{padding-bottom:10px}
  .tabs{flex-direction:row; overflow-x:auto; gap:8px; padding:6px 2px 12px}
  .tab{flex:none; width:auto; padding:10px 14px; font-size:13px}
  .side .spacer{display:none}
  .usercard{flex-direction:row; align-items:center; justify-content:space-between; padding:10px 14px}
  .usercard label{display:none}
  .main{padding:10px 14px 30px}
  .topbar{flex-wrap:wrap}
  .search{width:100%; order:5; height:42px}
  .tiles{grid-template-columns:1fr 1fr; gap:14px}
  .journey{grid-template-columns:repeat(3,1fr); gap:10px 6px}
  .journey:before{display:none}
  .feed li{grid-template-columns:1fr}
  .row{gap:16px}
  .aitem{grid-template-columns:1fr 1fr; gap:10px}
}

/* =====================================================================
   BENTO EVERYWHERE: the frame and every screen are built from tiles
   ===================================================================== */

/* ---------- Frame as tiles ---------- */
.side{padding:26px 10px 26px 26px; gap:20px}
.side .logo{padding:18px 18px 14px; gap:10px}
.side .logo img{max-width:100%}
.navtile{padding:12px}
.navtile .tabs{gap:6px}
.side .usercard{padding:14px 16px}
.main{padding:26px 30px 40px 10px}
.toprow{grid-auto-rows:auto; margin-bottom:20px}
.head{flex-direction:row; align-items:center; justify-content:space-between; gap:18px; padding:18px 24px}
.head-l{display:flex; align-items:center; gap:16px; min-width:0}
.head-t{min-width:0}
.head h2{font-size:22px; letter-spacing:-.02em; line-height:1.2; margin:0}
.head .lead{margin:3px 0 0; font-size:13.5px}
.head .eyebrow{margin-bottom:3px}
.head-r{flex:none; display:flex; gap:10px; align-items:center}
.head-r select.pin{width:auto; min-width:170px}
.periodsel{display:flex; align-items:center; gap:10px; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-3)}
.searchtile{justify-content:center; padding:18px 20px}
.searchtile .search{width:100%; height:46px}
.iconbtn{width:46px; height:46px; padding:0; justify-content:center; border-radius:15px; flex:none}
.iconbtn svg.i{width:19px; height:19px}
.netbanner{margin:0 0 20px}
.proto{margin-top:30px}

/* ---------- Shared tile parts ---------- */
.seclabel{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:8px 4px 16px; font-size:18px; scroll-margin-top:18px}
.seclabel b{font-weight:700; letter-spacing:-.01em}
.seclabel .sub{font-size:12.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--text-3)}
.seclabel .spacer{flex:1}
.muted{color:var(--text-3)}
.meta{font-size:12.5px; color:var(--text-2)}
.av{width:44px; height:44px; border-radius:14px; display:grid; place-items:center; font-weight:800; font-size:14px; color:#fff; background:var(--tabc,#8b95a7); box-shadow:3px 3px 8px rgba(0,0,0,.15); flex:none}
.av.lg{width:56px; height:56px; border-radius:18px; font-size:17px}
.av.sm{width:32px; height:32px; border-radius:10px; font-size:11px; box-shadow:2px 2px 5px rgba(0,0,0,.14)}
.avatar.sm{width:32px; height:32px; font-size:11px}
.tile.click{cursor:pointer; transition:box-shadow .12s, transform .12s}
.tile.click:hover{transform:translateY(-2px)}
.tile.on{box-shadow:var(--inset)}
.tile.on:hover{transform:none}
.plist{display:flex; flex-direction:column; gap:10px}
.prow{display:grid; grid-template-columns:32px minmax(0,1fr) auto; gap:12px; align-items:center; padding:10px 12px; border-radius:var(--r-md); box-shadow:var(--raise-xs)}
.prow.click{cursor:pointer; transition:box-shadow .12s}
.prow.click:hover{box-shadow:var(--raise-sm)}
.prow.sel{grid-template-columns:32px minmax(0,1fr) 140px}
.prow .pin{padding:8px 26px 8px 10px; font-size:12.5px; background-position:right 9px center}
.p-n b{display:block; font-size:13.5px; line-height:1.25}
.p-n span{display:block; font-size:12px; color:var(--text-3)}
.p-n span span{display:inline}
.chase .p-n b{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.hero-card .hc-stats{margin-top:auto; padding-top:6px}
.sbars{display:flex; flex-direction:column; gap:11px; margin-top:4px}
.sbar{display:grid; grid-template-columns:minmax(0,170px) minmax(0,1fr) 64px; gap:12px; align-items:center; font-size:12.5px; font-weight:600; color:var(--text-2)}
.sbar[data-act]{cursor:pointer}
.sbar[data-act]:hover>span{color:var(--text)}
.sbar>span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sbar-t{height:12px; border-radius:6px; box-shadow:var(--inset-xs); padding:3px}
.sbar-t i{display:block; height:100%; border-radius:3px}
.sbar b{text-align:right; color:var(--text); font-size:12.5px}
.listtile .filters{margin:0 0 16px}
.listtile>h3{flex-wrap:wrap}

/* ---------- Stage mix (quotations) ---------- */
.mixtop{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.mixtop .val{font-size:40px; font-weight:800; letter-spacing:-.03em; line-height:1}
.mixtop .foot{font-size:13px; color:var(--text-3)}
.mixbar{display:flex; gap:3px; height:24px; border-radius:12px; padding:5px; box-shadow:var(--inset-sm); margin:14px 0 16px}
.mixbar i{display:block; border-radius:7px; min-width:10px}
.mixgrid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-top:auto}
.mixitem{border-radius:var(--r-md); padding:10px 12px; box-shadow:var(--raise-xs); cursor:pointer; display:flex; flex-direction:column; gap:1px; transition:box-shadow .12s; min-width:0}
.mixitem:hover{box-shadow:var(--raise-sm)}
.mixitem.on{box-shadow:var(--inset-sm)}
.mi-name{font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--text-2); line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.mixitem b{font-size:20px; font-weight:800; line-height:1.25}
.mi-val{font-size:11.5px; color:var(--text-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.mixitem em,.hc-sub em{font-style:normal; color:var(--red); font-weight:700}

/* ---------- Soft row lists ---------- */
.qlist{display:flex; flex-direction:column; gap:10px}
.qhead,.qrow{display:grid; grid-template-columns:var(--cols); gap:14px; align-items:center}
.qhead{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-3); padding:0 18px 2px}
.qrow{padding:12px 18px; border-radius:var(--r-md); box-shadow:var(--raise-sm); cursor:pointer; transition:box-shadow .12s}
.qrow:hover{box-shadow:var(--raise)}
.qrow>*,.qhead>*{min-width:0}
.qrow .r,.qhead .r{text-align:right}
.q-id{font-size:13px; font-weight:600}
.q-id .num{display:block}
.q-main b{display:block; font-size:13.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.q-sub{display:block; font-size:12px; font-weight:500; color:var(--text-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.q-stage{display:block; font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.q-val{font-size:13.5px}
.q-val .muted{font-family:'IBM Plex Sans',sans-serif; font-size:12px}
.q-st{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end}
.qlist .empty{margin-top:4px}

/* ---------- Quotation record ---------- */
.cust-n{font-size:17px; font-weight:700; line-height:1.25}
.hc-top{display:flex; gap:14px; align-items:center}
.hero-card{gap:12px}
.hero-card .kv{margin-top:2px}
.statusb .dayp{align-self:stretch; margin-top:2px}
.dayp-l{display:flex; justify-content:space-between; gap:10px; font-size:12.5px; font-weight:600; color:var(--text-2); margin-bottom:6px}
.dayp-l .over{color:var(--red); font-weight:700}
.dayp-t{height:14px; border-radius:7px; box-shadow:var(--inset-xs); padding:3px}
.dayp-t i{display:block; height:100%; border-radius:4px}
.dayp-f{font-size:12.5px; color:var(--text-3); margin-top:6px}
.dayp-f b{color:var(--text-2)}
.statusb .btnrow{align-self:stretch}
.valb{gap:6px}
.mm{margin-top:12px}
.mm-t{position:relative; height:14px; border-radius:7px; box-shadow:var(--inset-xs); padding:3px}
.mm-t i{display:block; height:100%; border-radius:4px; background:linear-gradient(90deg,#2fb57f,#178f64)}
.mm-t i.low{background:linear-gradient(90deg,#e8343c,#a8151f)}
.mm-t b{position:absolute; top:-4px; bottom:-4px; width:2px; margin-left:-1px; border-radius:1px; background:var(--text)}
.mm-l{position:relative; height:17px; margin-top:4px; font-size:11px; font-weight:600; color:var(--text-3)}
.mm-l span{position:absolute; top:0; transform:translateX(-50%); white-space:nowrap}
.valb .stamp{align-self:flex-start; margin-top:4px}

/* ---------- Customers, vendors ---------- */
.hc-val{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.hc-val .val{font-size:34px; font-weight:800; letter-spacing:-.03em; line-height:1.1}
.hc-sub{font-size:13px; color:var(--text-3)}
.hero-card .mixbar{margin:2px 0 0}
.hc-legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; font-weight:600; color:var(--text-2)}
.hc-row{display:flex; align-items:center; gap:16px}
.hc-row .gauge{width:92px; height:92px; flex:none}
.hc-big{font-size:15px; font-weight:700}
.hc-stats{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-top:auto}
.hc-stats div{border-radius:var(--r-sm); padding:9px 11px; box-shadow:var(--inset-xs); min-width:0}
.hc-stats span{display:block; font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--text-3); line-height:1.3}
.hc-stats b{font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block}
.hc-stats b .locked{font-weight:500}
.card .av{margin-bottom:10px}
.card .foot{gap:6px}
.card .foot .stamp{padding:4px 10px 4px 8px; font-size:11px}

/* ---------- Settings ---------- */
.trows{display:flex; flex-direction:column; gap:10px}
.thead,.trow{display:grid; grid-template-columns:minmax(0,1fr) 72px 72px 138px 138px; gap:12px; align-items:center}
.thead{font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-3); padding:0 14px}
.thead .r{text-align:right}
.trow{padding:9px 14px; border-radius:var(--r-md); box-shadow:var(--raise-sm)}
.t-n{display:flex; align-items:center; gap:10px; min-width:0; font-size:13.5px}
.t-n b{line-height:1.25}
.t-badge{width:24px; height:24px; border-radius:50%; display:grid; place-items:center; color:#fff; font-size:11.5px; font-weight:700; font-style:normal; flex:none}
.t-f{display:block; min-width:0}
.trow .pin{padding:8px 10px; font-size:12.5px}
.trow select.pin{padding-right:26px; background-position:right 9px center}
.t-foot{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:16px}
.t-foot .spacer{flex:1}
.bigin{display:flex; align-items:baseline; gap:8px; margin:6px 0 10px}
.bigin .pin{width:116px; font-size:30px; font-weight:800; padding:8px 14px; letter-spacing:-.02em}
.bigin span{font-size:22px; font-weight:700; color:var(--text-2)}
.opt{display:flex; align-items:flex-start; gap:4px; padding:11px 12px; border-radius:var(--r-md); box-shadow:var(--raise-xs); cursor:pointer; margin-bottom:10px}
.opt.on{box-shadow:var(--inset-sm)}
.opt input{margin-top:3px}
.opt b{display:block; font-size:13.5px}
.opt em{display:block; font-style:normal; font-size:12px; color:var(--text-3)}
.twof{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.twof .field{margin:0 0 8px}
.suffix{display:flex; align-items:center; gap:8px}
.suffix span{font-weight:700; color:var(--text-2)}
.infot{flex-direction:row; gap:16px; align-items:flex-start}
.infot .ico{width:44px; height:44px; border-radius:14px; display:grid; place-items:center; box-shadow:var(--inset-sm); color:var(--accent); flex:none}
.infot p{margin:6px 0 0; font-size:13.5px; color:var(--text-2)}
.matrix td,.matrix th{padding:9px 8px}
.matrix td:first-child,.matrix th:first-child{padding-left:4px}

/* ---------- Responsive ---------- */
@media (max-width:1440px){
  .qhead,.qrow{grid-template-columns:var(--cols-l, var(--cols))}
  .qrow .hide-l,.qhead .hide-l{display:none}
}
@media (max-width:1240px){
  .t6{grid-column:span 6}
  .t12{grid-column:span 12}
  .tm6{grid-column:span 6}
  .t8{grid-column:span 8}
  .t4{grid-column:span 4}
  .toprow .head,.toprow .searchtile{grid-column:span 12}
  .qhead,.qrow{grid-template-columns:var(--cols-m, var(--cols-l, var(--cols)))}
  .hc-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .w-people .plist{display:grid; grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:980px){
  .t6,.t12,.t8,.t4{grid-column:span 12}
  .toprow .head,.toprow .searchtile{grid-column:span 12}
  .app{grid-template-columns:1fr}
  .side{position:static; height:auto; overflow:visible; display:grid; grid-template-columns:minmax(0,1fr) auto; padding:14px 14px 0; gap:14px}
  .side .logo{grid-column:1; padding:12px 14px; justify-content:center}
  .side .logo img{max-width:150px}
  .side .logo .cap{display:none}
  .side .usercard{grid-column:2; grid-row:1; padding:10px 12px; justify-content:center}
  .side .usercard .signout{display:none}
  .side .navtile{grid-column:1 / -1; grid-row:2; padding:8px}
  .side .spacer{display:none}
  .navtile .tabs{flex-direction:row; overflow-x:auto; gap:6px; padding:4px; scrollbar-width:none}
  .tab{flex:none; width:auto; padding:10px 14px; font-size:13px}
  .main{padding:14px 14px 30px}
  .toprow{margin-bottom:14px}
  .head{flex-direction:column; align-items:flex-start; padding:16px}
  .head-l{align-items:flex-start}
  .head h2{font-size:19px}
  .searchtile{padding:12px 14px}
  .feed li{grid-template-columns:1fr}
  .row{gap:16px}
  .aitem{grid-template-columns:1fr 1fr; gap:10px}
  .proto{gap:12px}
  .qhead{display:none}
  .qrow{grid-template-columns:minmax(0,1fr) auto; gap:6px 10px}
  .qrow .full-m{grid-column:1 / -1}
  .qrow .r{text-align:left}
  .qrow .q-id{order:-2}
  .qrow .q-st{order:-1}
  .thead{display:none}
  .trow{grid-template-columns:1fr 1fr}
  .trow .t-n{grid-column:1 / -1}
  .t-f:before{content:attr(data-l); display:block; font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-3); margin-bottom:3px}
  .mixgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mixtop .val{font-size:34px}
  .w-people .plist{grid-template-columns:1fr}
  .twof{grid-template-columns:1fr}
  .infot{flex-direction:column}
  .hc-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sbar{grid-template-columns:minmax(0,110px) minmax(0,1fr) 58px; gap:8px}
  .prow.sel{grid-template-columns:32px minmax(0,1fr)}
  .prow.sel .pin{grid-column:1 / -1}
  .seclabel{font-size:16px}
}

/* =====================================================================
   FLAT: bento tiles as plain surfaces, no soft 3D anywhere
   ===================================================================== */
body{background:var(--bg)}

/* ---------- Surfaces ---------- */
.b,.panel,.card-x,.section,.usercard,.tile,.folder,.card,.chart,.tablewrap{background:var(--surface); border:1px solid var(--line); box-shadow:var(--raise)}
.b .tablewrap,.b .filters{border:0; background:transparent; box-shadow:none}
.b.chart{padding:20px 22px 14px}
.modal{background:var(--surface); border:1px solid var(--line); box-shadow:0 24px 56px rgba(18,24,40,.18); border-radius:18px}
#modalwrap{background:rgba(20,23,28,.38); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px)}
.slip{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--accent); box-shadow:var(--lift)}
.slip.red{border-left-color:var(--red)}
.slip.green{border-left-color:var(--green)}
.netbanner{box-shadow:none; border:1px solid #f2dcb9}
.proto{border:1px dashed var(--line-2)}
.doc{border:1px solid var(--line); box-shadow:none}
.empty,.rep,.tot,.hc-stats div{background:var(--bg-2); border:1px solid var(--line); box-shadow:none}

/* ---------- Sidebar ---------- */
.side .logo,.side .navtile,.side .usercard{background:var(--surface); border:1px solid var(--line); box-shadow:var(--raise)}
.tab{border:1px solid transparent}
.tab:hover{background:var(--bg-2); box-shadow:none; color:var(--text)}
.tab.active{background:var(--accent-soft); border-color:#f6d5d4; box-shadow:none; color:var(--accent-ink)}
.tab .cnt{background:var(--ink); box-shadow:none}
.tab .cnt.alert{background:var(--accent); box-shadow:none}

/* ---------- Buttons ---------- */
.btn{background:var(--surface); border:1px solid var(--line-2); box-shadow:none}
.btn:hover{background:var(--bg-2); color:var(--accent-ink)}
.btn:active{background:var(--bg-3); box-shadow:none; transform:translateY(1px)}
.btn.primary,.btn.primary:active{background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:none}
.btn.primary:hover{background:var(--accent-2); border-color:var(--accent-2); filter:none}
.btn.danger,.btn.danger:active{background:var(--ink); border-color:var(--ink); color:#fff; box-shadow:none}
.btn.danger:hover{background:#2b2f37}
.btn.success,.btn.success:active{background:var(--green); border-color:var(--green); color:#fff; box-shadow:none}
.btn[disabled]:active{transform:none; background:var(--surface)}
.tbl-toggle{background:var(--surface); border:1px solid var(--line-2); box-shadow:none}

/* ---------- Inputs ---------- */
.pin,.search{background:var(--surface); border:1px solid var(--line-2); box-shadow:none}
.pin:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.search:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.pin[disabled],.pin[readonly]{background:var(--bg-2); border-color:var(--line); box-shadow:none}
.chip{background:var(--bg-2); border:1px solid var(--line); box-shadow:none}
.stamp{box-shadow:none}
.toggle{background:var(--bg-3); border:1px solid var(--line); box-shadow:none}
.toggle .knob{background:var(--surface); box-shadow:0 1px 2px rgba(18,24,40,.22)}
.toggle.on{background:var(--ink); border-color:var(--ink); box-shadow:none}
.toggle.on .knob{box-shadow:none}

/* ---------- Marks and wells ---------- */
.avatar,.jc-own{background:var(--bg-2); border:1px solid var(--line); box-shadow:none}
.av{box-shadow:none}
.tile .ico,.infot .ico{background:var(--accent-soft); box-shadow:none; color:var(--accent)}
.tile.good .ico{background:var(--green-soft); color:var(--green)}
.tile.alert .ico{background:var(--red-soft); color:var(--red)}
.sbar-t,.mixbar,.dayp-t,.mm-t{background:var(--track); border:1px solid var(--line); box-shadow:none}
.warn{background:var(--red-soft); border:1px solid #f6cdc9; box-shadow:none}
.ok{background:var(--green-soft); border:1px solid #c3e5d5; box-shadow:none}
.note{background:var(--amber-soft); border:1px solid #f1ddba; box-shadow:none}

/* ---------- Rows ---------- */
.qrow,.prow,.trow,.mixitem,.opt,.jcard,.aitem{background:var(--surface); border:1px solid var(--line); box-shadow:none}
.qrow:hover,.aitem:hover,.jcard:hover{border-color:var(--line-2); box-shadow:var(--lift)}
.prow.click:hover,.mixitem:hover{border-color:var(--line-2); box-shadow:none}
.mixitem.on,.opt.on{background:var(--accent-soft); border-color:#f0c9c7; box-shadow:none}
.card.open,.tile.on{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.tile.click:hover{box-shadow:var(--lift)}
.card:hover{box-shadow:var(--lift)}
.ledger th,.ledger td{border-bottom:1px solid var(--line)}
.ledger tr.click:hover td{background:var(--bg-2)}
.ledger tfoot td{border-top:1px solid var(--line-2)}
.feed li{border-bottom:1px solid var(--line)}

/* ---------- Journey ---------- */
.jp .chev:hover{transform:none}
.jp .chev{transition:opacity .12s}
.jp .chev:not(.static):hover{opacity:.88}
.card .av,.av.lg,.av.sm{box-shadow:none}
.avatar .st{border-color:var(--surface)}
.btn.primary[disabled],.btn.danger[disabled]{background:var(--bg-3); border-color:var(--line-2); color:var(--text-3); opacity:1}

/* =====================================================================
   CUPBOARD: filters | list | detail door
   ===================================================================== */
.cupboard{display:grid; grid-template-columns:208px minmax(0,1fr); gap:11px; align-items:start}
.cupboard.open{grid-template-columns:208px minmax(300px,0.95fr) minmax(540px,1.3fr)}
.cb-rail,.cb-list,.cb-door{min-width:0}
.cb-rail{position:sticky; top:14px; padding:12px 13px}
.cb-rail h4{font-size:10px; font-weight:700; letter-spacing:.11em; text-transform:uppercase; color:var(--text-3); margin:12px 0 6px}
.cb-rail h4:first-child{margin-top:0}
.cb-rail .field{margin:0 0 7px}
.srch{display:flex; align-items:center; gap:7px; padding:0 10px; height:32px; border-radius:var(--r-sm); background:var(--surface); border:1px solid var(--line-2)}
.srch:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.srch svg.i{width:15px; height:15px; color:var(--text-3)}
.srch input{border:0; outline:0; background:transparent; font:inherit; font-size:12.5px; width:100%; min-width:0}
.fchips{display:flex; flex-wrap:wrap; gap:5px}
.fchip{font-size:11px; font-weight:600; padding:4px 9px; border-radius:999px; cursor:pointer; background:var(--surface); border:1px solid var(--line); color:var(--text-2); white-space:nowrap}
.fchip:hover{border-color:var(--line-2)}
.fchip.on{background:var(--accent-soft); border-color:#f0c9c7; color:var(--accent-ink)}
.fstage{display:flex; flex-direction:column; gap:3px}
.fst{display:flex; align-items:center; gap:7px; padding:5px 8px; border-radius:var(--r-sm); cursor:pointer; font-size:12px; font-weight:600; color:var(--text-2); border:1px solid transparent}
.fst:hover{background:var(--bg-2)}
.fst.on{background:var(--accent-soft); border-color:#f0c9c7; color:var(--accent-ink)}
.fst b{margin-left:auto; font-size:11.5px; color:var(--text-3)}
.fst.on b{color:var(--accent-ink)}
.cb-list{padding:11px 12px; max-height:calc(100vh - 118px); overflow:auto; scrollbar-width:thin}
.cb-head{display:flex; align-items:baseline; gap:8px; margin-bottom:9px; flex-wrap:wrap}
.cb-head b{font-size:13px}
.cb-head .sub{font-size:11.5px; color:var(--text-3)}
.cb-head .spacer{flex:1}
.qcard{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:3px 10px; padding:9px 11px; border-radius:var(--r-md); border:1px solid var(--line); background:var(--surface); cursor:pointer; margin-bottom:6px}
.qcard:hover{border-color:var(--line-2); box-shadow:var(--lift)}
.qcard.on{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft)}
.qc-ref{font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600; color:var(--text-2)}
.qc-cust{font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.qc-sub{grid-column:1/-1; font-size:11.5px; color:var(--text-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.qc-foot{grid-column:1/-1; display:flex; align-items:center; gap:8px; margin-top:4px; font-size:11px; color:var(--text-3); flex-wrap:wrap}
.qc-foot .num{font-weight:600; color:var(--text)}
.qc-r{text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:3px}
.ptag{font-size:9.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:2px 7px; border-radius:5px; background:var(--bg-3); color:var(--text-2); white-space:nowrap}
.ptag.services{background:#e2f0fb; color:#1f5e8c}.ptag.product{background:#e7f3ec; color:#166c4c}
.ptag.project{background:#efe6fa; color:#5b3b8c}.ptag.system{background:#fce8f2; color:#8c2f66}
.ptag.spares{background:#fdefdc; color:#8a5a12}
.cb-door{padding:0; max-height:calc(100vh - 118px); overflow:auto; animation:doorIn .2s cubic-bezier(.22,1,.36,1); scrollbar-width:thin}
@keyframes doorIn{from{opacity:0; transform:translateX(16px)}to{opacity:1; transform:none}}
.dr-top{position:sticky; top:0; z-index:3; background:var(--surface); border-bottom:1px solid var(--line); padding:12px 15px 0; border-radius:var(--r) var(--r) 0 0}
.dr-t1{display:flex; align-items:flex-start; gap:10px}
.dr-t1 .spacer{flex:1}
.dr-ref{font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600; color:var(--text-3)}
.dr-top h3{font-size:16px; margin:2px 0 3px; line-height:1.25}
.dr-meta{font-size:11.5px; color:var(--text-2)}
.dtabs{display:flex; gap:2px; margin-top:10px; overflow-x:auto; scrollbar-width:none}
.dtab{padding:7px 12px; font-size:12px; font-weight:600; color:var(--text-2); cursor:pointer; border:0; background:transparent; border-bottom:2px solid transparent; white-space:nowrap}
.dtab:hover{color:var(--text)}
.dtab.on{color:var(--accent-ink); border-bottom-color:var(--accent)}
.dr-body{padding:13px 15px 16px}
.dr-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
.dr-cell{border:1px solid var(--line); border-radius:var(--r-md); padding:10px 12px; background:var(--bg-2); min-width:0}
.dr-cell.full{grid-column:1/-1}
.dr-cell .lbl{font-size:9.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-3); margin-bottom:3px}
.dr-cell .v{font-size:13px; font-weight:600}
.dr-cell .v small{font-weight:500; color:var(--text-3)}
.closed-door{display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:8px; padding:40px 24px; color:var(--text-3)}
.closed-door svg{width:40px; height:40px; stroke:var(--text-3); fill:none; stroke-width:1.5}

/* ---------------------------------------------------------------- doc */
.sheet{background:#fff; border:1px solid var(--line); border-radius:8px; padding:26px 30px; font-size:11.5px; color:#1c2128; line-height:1.5}
.sheet .sh-top{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; border-bottom:2px solid #1c2128; padding-bottom:9px}
.sheet .sh-top img{width:168px}
.sheet .sh-type{font-size:16px; font-weight:800; letter-spacing:-.01em}
.sheet .sh-rowe{display:flex; justify-content:space-between; gap:16px; margin:12px 0 10px; font-weight:600}
.sheet .sh-to{margin-bottom:10px; white-space:pre-line}
.sheet .sh-attn{display:flex; flex-wrap:wrap; gap:4px 18px; padding:7px 10px; background:#f5f6f8; border-radius:6px; margin-bottom:12px}
.sheet h4.sh-subj{text-align:center; font-size:14px; text-transform:uppercase; letter-spacing:.02em; margin:14px 0 12px; line-height:1.4}
.sheet p{margin:0 0 10px}
.sheet table{width:100%; border-collapse:collapse; margin:10px 0}
.sheet th,.sheet td{border:1px solid #d3d7dd; padding:6px 8px; vertical-align:top}
.sheet th{background:#f4f5f7; font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em}
.sheet td.r,.sheet th.r{text-align:right}
.sheet .sh-note{font-size:10.5px; color:#5b6577}
.sheet .sh-terms td:first-child{width:170px; font-weight:700; background:#fafbfc}
.sheet .sh-foot{display:flex; justify-content:space-between; gap:14px; border-top:1px solid #d3d7dd; margin-top:16px; padding-top:9px; font-size:10px; color:#5b6577}
.sheet .sh-sign{margin-top:22px; font-weight:700}

/* ---------------------------------------------------------------- wizard */
.wiz{width:100%}
.modal.wide{max-width:980px}
.wz-steps{display:flex; gap:4px; margin:4px 0 16px; flex-wrap:wrap}
.wz-step{display:flex; align-items:center; gap:7px; padding:6px 11px; border-radius:999px; font-size:11.5px; font-weight:600; color:var(--text-3); background:var(--bg-2); border:1px solid var(--line)}
.wz-step i{width:18px; height:18px; border-radius:50%; display:grid; place-items:center; font-size:10.5px; font-weight:700; background:var(--bg-3); color:var(--text-2); font-style:normal}
.wz-step.on{background:var(--accent-soft); border-color:#f0c9c7; color:var(--accent-ink)}
.wz-step.on i{background:var(--accent); color:#fff}
.wz-step.done i{background:var(--green); color:#fff}
.wz-body{min-height:270px; max-height:min(62vh,560px); overflow:auto; padding-right:3px}
.wz-foot{display:flex; align-items:center; gap:9px; margin-top:16px; padding-top:13px; border-top:1px solid var(--line)}
.wz-foot .spacer{flex:1}
.ptiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:9px}
.ptile{border:1px solid var(--line); border-radius:var(--r-md); padding:12px; cursor:pointer; background:var(--surface)}
.ptile:hover{border-color:var(--line-2)}
.ptile.on{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft)}
.ptile b{display:block; font-size:13.5px; margin-bottom:3px}
.ptile span{font-size:11.5px; color:var(--text-3); line-height:1.4}
.g2{display:grid; grid-template-columns:1fr 1fr; gap:0 12px}
.g3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 12px}
.field.bad .pin{border-color:var(--red); box-shadow:0 0 0 3px var(--red-soft)}
.err{display:block; font-size:11px; font-weight:600; color:var(--red); margin-top:4px}
.errbox{display:flex; gap:9px; align-items:flex-start; padding:10px 13px; border-radius:var(--r-md); background:var(--red-soft); border:1px solid #f6cdc9; color:#8a1f1a; font-size:12.5px; margin-bottom:12px}
.errbox svg.i{width:16px; height:16px; flex:none; margin-top:1px}
.errbox b{display:block}
.wline{display:grid; grid-template-columns:minmax(0,2.2fr) 66px 62px minmax(0,1.3fr) 86px 78px 70px 30px; gap:7px; align-items:center; margin-bottom:6px}
.wline .pin{padding:6px 8px; font-size:12px}
.wline .mini{font-size:11px; color:var(--text-3); text-align:right}
.wline.head{font-size:9.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-3); margin-bottom:4px}
.wline.head .r{text-align:right}

/* ---------------------------------------------------------------- mail */
.mailbar{display:flex; align-items:center; gap:9px; padding:8px 12px; border-radius:var(--r-md); background:var(--bg-2); border:1px solid var(--line); font-size:12px; margin-bottom:12px}
.mailbar .dot{width:8px; height:8px; border-radius:50%; background:var(--green); flex:none}
.mailbar .dot.off{background:var(--red)}
.mailbar .spacer{flex:1}
.mrow{display:grid; grid-template-columns:62px minmax(0,1fr); gap:9px; align-items:center; padding:7px 0; border-bottom:1px solid var(--line)}
.mrow .k{font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-3)}
.mrow .pin{border:0; box-shadow:none; padding:3px 0; background:transparent}
.mrow .pin:focus{box-shadow:none; border:0; outline:1px solid var(--accent); outline-offset:3px; border-radius:3px}
.attach{display:inline-flex; align-items:center; gap:7px; padding:6px 11px; border-radius:var(--r-sm); background:var(--bg-2); border:1px solid var(--line); font-size:11.5px; font-weight:600; margin-top:10px}
.attach svg.i{width:14px; height:14px; color:var(--accent)}
.mbody{width:100%; min-height:150px; resize:vertical; margin-top:10px; line-height:1.55}

/* ---------------------------------------------------------------- login */
#login{position:fixed; inset:0; z-index:90; background:var(--bg); display:none; place-items:center; padding:20px; overflow:auto}
#login.show{display:grid}
.lg{width:min(420px,100%); background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:30px 32px; box-shadow:0 2px 6px rgba(18,24,40,.06)}
.lg img{width:170px; display:block; margin-bottom:22px}
.lg h1{font-size:21px; margin:0 0 5px; letter-spacing:-.02em}
.lg p.sub{font-size:12.5px; color:var(--text-2); margin:0 0 20px; line-height:1.5}
.msbtn{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:11px 14px; border-radius:var(--r-md);
  border:1px solid var(--line-2); background:var(--surface); font-size:13.5px; font-weight:600; cursor:pointer; margin-bottom:9px}
.msbtn:hover{background:var(--bg-2)}
.msbtn[disabled]{opacity:.6; cursor:progress}
.msbtn .ms{display:grid; grid-template-columns:9px 9px; grid-gap:2px; flex:none}
.msbtn .ms i{width:9px; height:9px; display:block}
.lg .alt{width:100%; padding:9px; border:0; background:transparent; font-size:12px; color:var(--text-3); cursor:pointer; text-decoration:underline}
.lg .tenant{display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--text-3); margin-top:18px; padding-top:14px; border-top:1px solid var(--line)}
.spin{width:15px; height:15px; border:2px solid var(--line-2); border-top-color:var(--accent); border-radius:50%; animation:sp .7s linear infinite; flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------------------------------------------------------------- misc */
.amc{display:flex; align-items:center; gap:9px; padding:8px 11px; border-radius:var(--r-md); border:1px solid var(--line); background:var(--surface); margin-bottom:6px}
.amc .spacer{flex:1}
.amc b{font-size:12.5px; display:block}
.amc span{font-size:11px; color:var(--text-3)}
.amc.due{background:#fdf6e9; border-color:#f1ddba}
.amc.over{background:var(--red-soft); border-color:#f6cdc9}
.prods{display:flex; flex-wrap:wrap; gap:5px}
.prod{font-size:11px; font-weight:600; padding:4px 9px; border-radius:999px; background:var(--bg-2); border:1px solid var(--line); color:var(--text-2)}
.ohist{display:flex; flex-direction:column; gap:5px}
.orow{display:grid; grid-template-columns:minmax(0,1fr) 92px 92px 108px; gap:9px; align-items:center; padding:7px 10px; border-radius:var(--r-sm); border:1px solid var(--line); font-size:12px}
.orow .r{text-align:right}
.orow b{font-size:12.5px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.orow span{font-size:10.5px; color:var(--text-3)}
.ohead{display:grid; grid-template-columns:minmax(0,1fr) 92px 92px 108px; gap:9px; padding:0 10px 2px; font-size:9.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--text-3)}
.ohead .r{text-align:right}
@media (max-width:1240px){
  .cupboard,.cupboard.open{grid-template-columns:200px minmax(0,1fr)}
  .cupboard.open .cb-list{display:none}
  .dr-grid{grid-template-columns:1fr}
  .wline{grid-template-columns:minmax(0,1fr) 60px 58px 80px 70px 30px}
  .wline .hide-s{display:none}
}
@media (max-width:980px){
  .cupboard,.cupboard.open{grid-template-columns:1fr}
  .cb-rail{position:static}
  .cb-list,.cb-door{max-height:none}
  .cupboard.open .cb-rail{display:none}
  .g2,.g3{grid-template-columns:1fr}
  .orow,.ohead{grid-template-columns:minmax(0,1fr) 88px}
  .orow .hide-s,.ohead .hide-s{display:none}
  .sheet{padding:16px 15px}
}


/* ---------- fits: narrower cupboard, mobile re-assertions ---------- */
.cupboard.open{grid-template-columns:200px minmax(250px,0.95fr) minmax(440px,1.3fr)}
.kv dd{word-break:break-word; min-width:0}
.kv{grid-template-columns:minmax(0,auto) minmax(0,1fr)}
.amc{flex-wrap:wrap}
.amc .stamp{white-space:nowrap}
.mailbar{flex-wrap:wrap}
@media (max-width:1400px){.cupboard.open{grid-template-columns:200px minmax(230px,0.9fr) minmax(400px,1.35fr)}}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .main{padding:12px 12px 22px}
  .side{padding:12px 12px 0; gap:10px}
  .aitem>*{min-width:0}
  .aitem .a-stage b,.aitem .a-stage span{overflow:hidden; text-overflow:ellipsis; display:block}
  .head-r{flex-wrap:wrap}
  .head-r select.pin,.head-r .periodsel{min-width:0; width:100%}
  .periodsel{flex-wrap:wrap}
  .proto select.pin{min-width:0; width:100%}
  .proto label{flex:1 1 100%}
  .b .kv dd{font-size:12px}
  .wline{grid-template-columns:minmax(0,1fr) 54px 50px 64px 26px; gap:5px}
  .wline .hide-s,.wline.head .hide-s{display:none}
  .wz-steps{gap:3px}
  .wz-step{padding:5px 8px; font-size:10.5px}
  .sheet .sh-top{flex-direction:column; gap:8px}
  .sheet .sh-rowe,.sheet .sh-attn,.sheet .sh-foot{flex-direction:column; gap:3px}
  .sheet .sh-terms td:first-child{width:92px}
  .dr-grid{grid-template-columns:1fr}
}

/* ---------- filters sit above the list ---------- */
.qbar{display:flex; flex-direction:column; gap:9px; padding:11px 13px; margin-bottom:11px}
.qbar-r{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.qbar-r .spacer{flex:1}
.qbar .srch{flex:1 1 250px; max-width:400px; height:32px}
.qbar .pin{width:auto; min-width:142px}
.qgrp{display:flex; align-items:center; gap:5px; flex-wrap:wrap}
.qgl{font-size:9.5px; font-weight:700; letter-spacing:.11em; text-transform:uppercase; color:var(--text-3); margin-right:3px}
.fchip b{margin-left:5px; font-weight:700; opacity:.6}
.fchip .sdot{margin-right:5px; width:7px; height:7px}
.cupboard{grid-template-columns:minmax(0,1fr)}
.cupboard.open{grid-template-columns:minmax(300px,0.85fr) minmax(480px,1.25fr)}
.cb-list,.cb-door{max-height:calc(100vh - 182px)}
@media (max-width:1400px){.cupboard.open{grid-template-columns:minmax(255px,0.8fr) minmax(425px,1.3fr)}}
@media (max-width:1240px){
  .cupboard,.cupboard.open{grid-template-columns:1fr}
  .cupboard.open .cb-list{display:none}
}
@media (max-width:980px){
  .qbar .srch{max-width:none; flex:1 1 100%}
  .qbar .pin{flex:1 1 45%; min-width:0}
  .qbar-r .spacer{display:none}
  .cb-list,.cb-door{max-height:none}
}

/* ---------- one navigation panel, full height, user inside it ---------- */
.side{padding:14px 6px 14px 14px; gap:0}
.sidepanel{flex:1; min-height:0; display:flex; flex-direction:column; padding:14px 12px 12px; gap:9px}
.sidepanel .logo{display:flex; flex-direction:column; gap:7px; padding:4px 4px 12px; border-bottom:1px solid var(--line)}
.sidepanel .logo img{width:100%; max-width:146px; height:auto; display:block}
.sidepanel .logo .cap{font-weight:600; font-size:9.5px; color:var(--text-3); letter-spacing:.14em; text-transform:uppercase}
.sidepanel .tabs{display:flex; flex-direction:column; gap:3px; min-height:0; overflow-y:auto; scrollbar-width:thin}
.sidepanel .spacer{flex:1; min-height:8px}
.sidepanel .usercard{background:transparent; border:0; box-shadow:none; border-radius:0; border-top:1px solid var(--line);
  padding:11px 4px 0; margin:0; display:block}
.sidepanel .usercard .who{display:flex; align-items:center; gap:9px}
.sidepanel .usercard .signout{font-size:11px; color:var(--text-3); cursor:pointer; margin-top:2px}
.sidepanel .usercard .signout:hover{color:var(--accent-ink)}
@media (max-width:980px){
  .side{display:block; height:auto; position:static; padding:12px 12px 0}
  .sidepanel{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:9px; padding:10px 12px}
  .sidepanel .logo{grid-column:1; grid-row:1; border-bottom:0; padding:0; justify-content:center}
  .sidepanel .logo img{max-width:124px}
  .sidepanel .logo .cap{display:none}
  .sidepanel .usercard{grid-column:2; grid-row:1; border-top:0; padding:0; align-self:center}
  .sidepanel .usercard .rl{display:none}
  .sidepanel .usercard .signout{display:block; font-size:10.5px; margin-top:0}
  .sidepanel .tabs{grid-column:1 / -1; grid-row:2; flex-direction:row; overflow-x:auto; gap:5px; padding-bottom:2px}
  .sidepanel .tabs .tab{flex:none; width:auto}
  .sidepanel .spacer{display:none}
}

/* ---------- list card: number, customer, amount ---------- */
.qcard{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 12px; align-items:center; padding:10px 13px}
.qc-ref{font-size:11px; font-weight:600; color:var(--text-3)}
.qc-cust{font-size:13.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.qc-amt{font-size:14px; font-weight:700; white-space:nowrap; text-align:right}
.dr-sec{font-size:13px; font-weight:700; margin:18px 0 9px; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.dr-sec .sub{font-weight:500; font-size:11.5px; color:var(--text-3)}

.dr-sec{border-top:1px solid var(--line); padding-top:14px; margin-top:16px}
.dr-body .ledger.lines{font-size:11.5px}
.dr-body .ledger.lines th,.dr-body .ledger.lines td{padding:5px 4px}
.dr-body .ledger.lines th{font-size:9px}
.dr-body .ledger.lines .pin{padding:5px 6px; font-size:11.5px}
.dr-body .totals{grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); gap:7px}
.dr-body .tot{padding:7px 10px}
.dr-body .tot .val{font-size:14px}
.qbar{gap:0}
.qbar .pin{min-width:132px; flex:0 1 auto}
.qbar .srch{flex:1 1 220px; max-width:360px}

/* ===================== MARGIN ENGINE ===================== */
function roundTo(x, step){ if (step <= 0) return x; return Math.round(Math.round(x / step) * step * 100) / 100; }
function unitSell(l){
  if (l.c == null || isNaN(l.c)) return null;
  let s;
  if (l.t === 'fix') s = l.c + (l.m || 0);
  else if (S().basis === 'markup') s = l.c * (1 + (l.m || 0) / 100);
  else s = (l.m || 0) >= 100 ? l.c * 100 : l.c / (1 - (l.m || 0) / 100);
  return roundTo(s, S().rounding);
}
function lineCalc(l){
  const us = unitSell(l);
  if (us == null) return {ok:false, cost:0, sell:0, margin:0, markup:0, gm:0, unitSell:null};
  const cost = l.c * l.q, sell = us * l.q, margin = sell - cost;
  return {ok:true, cost, sell, margin, unitSell:us, markup: cost ? margin / cost * 100 : 0, gm: sell ? margin / sell * 100 : 0};
}
function quoteCalc(q){
  const ls = q.lines.map(lineCalc);
  const cost = ls.reduce((a,x) => a + x.cost, 0), sell = ls.reduce((a,x) => a + x.sell, 0);
  const margin = sell - cost, gst = sell * S().gst / 100;
  const incomplete = ls.filter(x => !x.ok).length;
  const below = q.lines.map((l,i) => ({l,i,c:ls[i]})).filter(x => x.c.ok && x.c.gm < S().floor - 1e-9);
  return {cost, sell, margin, gst, grand: sell + gst, markup: cost ? margin / cost * 100 : 0, gm: sell ? margin / sell * 100 : 0,
    incomplete, below, needsApproval: below.length > 0 && !q.marginApproved, lines:ls};
}

function stageInfo(q){
  const st = S().stages[q.stage];
  const entered = q.history[q.history.length - 1].at;
  const d = days(entered, iso(TODAY));
  let status = 'ontrack';
  if (q.outcome === 'won') status = 'won';
  else if (q.outcome === 'lost') status = 'lost';
  else if (st.target > 0 && d > st.target) status = 'stuck';
  else if (st.followUp > 0 && d >= st.followUp) status = 'followup';
  return {st, entered, d, status, due: addDays(entered, st.target), followDue: addDays(entered, st.followUp), over: d - st.target};
}
function subStatus(q){
  if (q.outcome !== 'open') return '';
  const id = S().stages[q.stage].id, c = quoteCalc(q);
  if (id === 'costing') { if (c.incomplete) return `awaiting vendor cost, ${c.incomplete} line${c.incomplete > 1 ? 's' : ''}`; if (c.needsApproval) return 'awaiting margin approval'; return 'costed, ready to quote'; }
  if (id === 'sent') return q.revision > 1 ? `in negotiation, Rev ${q.revision}` : 'with customer';
  if (id === 'order') return q.activity.some(a => /vendor order|placed/i.test(a.text)) ? 'vendor order placed' : 'PO in, vendor order pending';

/* ---------- Journey path: chevron stages ---------- */
function journeyPath(items, opts){
  const n = items.length, W = 1200, pad = 10, notch = 21, gap = 7, top = opts.rec ? 26 : 8, h = opts.compact ? 58 : 70;

  const metaH = opts.meta && !opts.rec ? 40 : 0, H = top + h + 8 + metaH;
  const uid = opts.uid;
  const shape = (i) => {
    const x0 = pad + i * (cw - notch + gap), r = 12, y0 = top, y1 = top + h, ym = top + h / 2;
    if (i === 0) return `M${x0 + r},${y0} L${x0 + cw - notch},${y0} L${x0 + cw},${ym} L${x0 + cw - notch},${y1} L${x0 + r},${y1} Q${x0},${y1} ${x0},${y1 - r} L${x0},${y0 + r} Q${x0},${y0} ${x0 + r},${y0} Z`;
    if (i === n - 1) return `M${x0},${y0} L${x0 + cw - r},${y0} Q${x0 + cw},${y0} ${x0 + cw},${y0 + r} L${x0 + cw},${y1 - r} Q${x0 + cw},${y1} ${x0 + cw - r},${y1} L${x0},${y1} L${x0 + notch},${ym} Z`;
    return `M${x0},${y0} L${x0 + cw - notch},${y0} L${x0 + cw},${ym} L${x0 + cw - notch},${y1} L${x0},${y1} L${x0 + notch},${ym} Z`;
  };
  const centre = (i) => { const x0 = pad + i * (cw - notch + gap); const l = i === 0 ? x0 : x0 + notch, r = i === n - 1 ? x0 + cw : x0 + cw - notch; return [(l + r) / 2, l, r]; };
  const live = items.findIndex(it => it.state === 'current');
  const defs = live < 0 ? '' : `<defs><clipPath id="${uid}clip"><path d="${shape(live)}"/></clipPath><linearGradient id="${uid}sweep" x1="0" x2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".4"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs>`;
  const anim = opts.animate !== false;
  const chevs = items.map((it, i) => {
    const [cx, l, r] = centre(i);
    const c = it.color || '#8a8f99';
    const sel = it.state === 'sel' || it.state === 'current';
    const fill = sel ? c : it.state === 'lost' ? '#d7dae0' : it.state === 'done' ? tint(c, .22) : it.state === 'pending' ? tint(c, .09) : tint(c, .12);
    const filt = '';
    const stroke = it.state === 'pending' ? `stroke="${tint(c, .45)}" stroke-width="1.3" stroke-dasharray="5 5"` : sel ? `stroke="${shade(c, .1)}" stroke-width="1"` : `stroke="${tint(c, .3)}" stroke-width="1"`;
    const nameFill = sel ? 'rgba(255,255,255,.88)' : it.state === 'pending' ? tint(c, .82) : shade(c, .15);
    const body = opts.meta
      ? `<text class="jname" style="fill:${nameFill}" x="${cx.toFixed(1)}" y="${top + 24}" text-anchor="middle">${esc(it.name)}</text><text class="jdate" x="${cx.toFixed(1)}" y="${top + 47}" text-anchor="middle">${esc(it.line1 || '')}</text>`
      : `<text class="jname" style="fill:${nameFill}" x="${cx.toFixed(1)}" y="${top + 21}" text-anchor="middle">${esc(it.name)}</text><text class="jcount" x="${cx.toFixed(1)}" y="${top + 48}" text-anchor="middle">${it.count}</text><text class="jval" x="${cx.toFixed(1)}" y="${top + 64}" text-anchor="middle">${esc(it.value || '')}</text>`;

function sparkline(vals){

function dayLine(d){
  const s = n => n === 1 ? '' : 's', isare = n => n === 1 ? 'is' : 'are';
  const nw = n => n === 1 ? 'one' : n, Nw = n => n === 1 ? 'One' : n;
  let pool;
  if (!d.open) pool = d.amc
    ? [`No open quotations. The ${nw(d.amc)} renewal${s(d.amc)} below ${isare(d.amc)} the easiest money on the board.`,
       `Quiet board today, with ${nw(d.amc)} renewal${s(d.amc)} waiting to be sold.`,
       `Nothing open right now, which makes this the right day to call the ${nw(d.amc)} renewal${s(d.amc)}.`]
    : ['No open quotations today. Good day to go and find some.',
       'Board is empty. Every pipeline starts with one call.'];
  else if (!d.stuck && !d.follow) pool = [
    `Nothing late, nothing waiting. All ${d.open} quotations are moving.`,
    `Clean board. Every one of the ${d.open} open quotations is inside its target.`,
    `No chasing today. ${d.inplay} is in play and all of it is on track.`,
    'Everything is exactly where it should be. Rare day, enjoy it.'];
  else if (!d.stuck) pool = [
    `Nothing has slipped. Just ${nw(d.follow)} call${s(d.follow)} today and the board stays clean.`,
    `No overdue work at all. ${Nw(d.follow)} customer${s(d.follow)} ${isare(d.follow)} waiting to hear from you.`,
    `Strong position. ${Nw(d.follow)} call${s(d.follow)} ${isare(d.follow)} all that stands between you and a clear board.`,
    `Nothing is late. ${Nw(d.follow)} call${s(d.follow)} between you and a finished day.`];
  else if (d.stuck < 3) pool = [
    `Short list today. ${d.stuck} past target, ${d.follow} due a call, the rest moving nicely.`,
    `${d.late} is sitting in ${nw(d.stuck)} quotation${s(d.stuck)}. Worth the first hour.`,
    `Mostly on track. ${Nw(d.stuck)} quotation${s(d.stuck)} need${d.stuck === 1 ? 's' : ''} a push and that is it.`,
    `Small pile today. ${d.stuck} to chase, and ${d.inplay} still in play behind ${d.stuck === 1 ? 'it' : 'them'}.`];
  else pool = [
    `${d.late} moves the moment those ${d.stuck} quotations do. Start at the top.`,
    `Full board today. ${d.stuck} past target, ${d.follow} due a call. One at a time.`,
    `${d.stuck} quotations are waiting on a decision, and the list is right below.`,
    `Plenty to chase. ${d.late} is tied up in the ${d.stuck} that slipped, so that is where the day pays.`];
  return pool[state.dayPick % pool.length];
}

    + kpi('', 'check', 'Awaiting approval', can('viewMargin') ? openAll.filter(q => quoteCalc(q).needsApproval).length : '·', can('viewMargin') ? 'below-floor margins' : 'hidden for your role', '');

  const anyFilter = f.stage !== 'all' || f.cust !== 'all' || f.owner !== 'all' || f.status !== 'all';
  const title = f.stage !== 'all' ? esc(stages[Number(f.stage)].name) : 'All quotations';
  const list = `<div class="b s12 listtile"><h3>${title} <span class="sub">${qs.length} of ${all.length} · click a row to open it</span></h3>
    <div class="filters">
      <div class="field"><label>Customer</label>${sel('cust', [['all','All customers'], ...CUSTOMERS.map(c => [c.id, c.name])], f.cust)}</div>
      <div class="field"><label>Owner</label>${sel('owner', [['all','Everyone'], ...state.users.filter(u => u.role === 'sales' || u.role === 'manager' || u.role === 'owner').map(u => [u.id, u.name])], f.owner)}</div>
      <div class="field"><label>Status</label>${sel('status', [['all','Any'],['stuck','Stuck'],['followup','Follow-up due'],['ontrack','On track'],['won','Won'],['lost','Lost']], f.status)}</div>
      ${anyFilter ? '<button class="btn sm" data-act="clearFilters">Clear filters</button>' : ''}
    </div>
    ${qList(qs, {empty:'No quotations match these filters.'})}</div>`;

  return pageHead({title:'Quotations', lead:'Every enquiry from intake to delivery. Pick a stage or a tile to filter the list.', right: can('editQuote') ? `<button class="btn primary" data-act="newQuote">${ico('plus')} New enquiry</button>` : ''})
    + `<div class="bento">${mix}${kpis}${list}</div>`;
}

/* ---------- Quotation record ---------- */

  const showCost = can('viewMargin') || can('editCost'), showMargin = can('viewMargin');
  const editMargin = can('editMargin') && q.outcome === 'open', editCost = can('editCost') && q.outcome === 'open', editQ = can('editQuote') && q.outcome === 'open';
  const sentIdx = stageIdx('sent');
  const next = S().stages[q.stage + 1];
  const blockers = [];
  if (q.outcome === 'open' && next) {
    if (q.stage + 1 >= sentIdx && c.incomplete) blockers.push(`${c.incomplete} line(s) still have no vendor cost.`);
    if (q.stage + 1 >= sentIdx && c.needsApproval) blockers.push(`${c.below.length} line(s) are below the ${S().floor}% margin floor and need approval before the quote can go out.`);
  }

  const lineRows = q.lines.map((l,i) => { const lc = c.lines[i]; const low = lc.ok && lc.gm < S().floor - 1e-9; return `<tr ${low ? 'style="background:#fff1ee"' : ''}>
